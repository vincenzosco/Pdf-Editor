# Folio on a single VM: the app container (built from the repository Dockerfile,
# so LibreOffice, Ghostscript, qpdf and Tesseract are all present) plus Caddy in
# front of it.
#
# The app listens on its default port, 80, inside the container; Caddy publishes
# that on the VM's public 80/443. With DOMAIN set (see .env.example) it requests
# a Let's Encrypt certificate for the name and redirects HTTP to HTTPS;
# deploy.sh defaults DOMAIN to <public-ip>.nip.io, a host name that resolves to
# the VM without owning any DNS.
#
# The build context is the repository root — the parent of this file — so a
# deploy is "copy the sources to the VM, then docker compose up -d --build".
name: folio

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: folio:${FOLIO_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 80
    ports:
      # Host 8080 -> the container's default 80, so the app stays reachable
      # directly (and healthcheck.sh --vm works) while Caddy owns 80/443.
      - "8080:80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      # ":80" is a valid Caddy site address, so an empty DOMAIN needs no branch.
      SITE_ADDRESS: ${DOMAIN:-:80}
      APP_UPSTREAM: ${APP_UPSTREAM:-app:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
