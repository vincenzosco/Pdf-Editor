  <style>
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== TOKENS =====
       Every colour, space, radius and duration in this file comes from here;
       nothing below re-declares a raw value. Contrast of the text tokens on
       --bg is asserted in test/client.test.mjs with the WCAG formula. */
    :root {
      /* palette */
      --bg: #F4F3EF;
      --surface: #FFFFFF;
      --surface-raised: #FDFCFA;
      --surface-2: #EDEBE6;
      --sidebar-bg: #EDEBE6;
      --text-primary: #1B1C20;
      --text-secondary: #5C6067;
      --text-muted: #656A70;
      --label: #5B5F66;
      --border: #E7E4DE;
      --border-strong: #CFC9BE;
      --border-input: #D8D3C9;
      --accent: #1F4C82;
      --accent-ink: #16324F;
      --accent-soft: #2F6FB3;
      --accent-red: #D13433;
      --accent-red-bright: #E4574F;
      --accent-red-deep: #8F1D1C;
      --accent-red-light: rgba(209, 52, 51, 0.08);
      --ink-blue: #1F4C82;
      --ink-blue-light: rgba(31, 76, 130, 0.06);
      --amber: #B45309;
      --amber-soft: rgba(180, 83, 9, 0.09);
      --success: #2F9E63;
      --success-text: #1D6B45;
      --success-bg: #F3FAF6;
      --success-border: #C4E4D2;
      --danger: #D13433;
      --danger-bg: #FDF4F3;
      --danger-border: #F2CCC9;
      --info-bg: #F1F6FB;
      --info-border: #CBD9EA;
      --info-text: #1D4E82;
      --warning: #B45309;
      --white: #FFFFFF;
      --scrim: rgba(27, 28, 32, 0.42);

      /* gradients, shadows, focus */
      --grad-ink: linear-gradient(135deg, #1F4C82 0%, #2F6FB3 100%);
      --grad-ink-deep: linear-gradient(135deg, #16324F 0%, #1F4C82 100%);
      --ring: 0 0 0 4px rgba(31, 76, 130, 0.14);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
      --shadow-lift: 0 14px 34px -14px rgba(27, 28, 32, 0.18), 0 2px 8px rgba(27, 28, 32, 0.05);

      /* spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;

      /* radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;

      /* type */
      --type-xs: 0.7rem;
      --type-sm: 0.8rem;
      --type-base: 0.875rem;
      --type-md: 0.95rem;
      --type-lg: 1.15rem;
      --type-xl: 1.5rem;
      --type-2xl: 2rem;

      /* motion */
      --dur-fast: 150ms;
      --dur: 200ms;
      --ease: cubic-bezier(0.2, 0.6, 0.2, 1);

      /* metrics */
      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --sidebar-w: 288px;
      --topbar-h: 60px;
    }

    html, body { height: 100%; font-family: var(--body); background: var(--bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--topbar-h); background: rgba(247, 246, 242, 0.85);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 var(--space-5); gap: var(--space-4);
    }
    .topbar::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(209, 52, 51, 0.45), rgba(31, 76, 130, 0.4), transparent);
      pointer-events: none;
    }
    .topbar .logo {
      display: flex; align-items: center; gap: var(--space-2); text-decoration: none;
      color: var(--text-primary); font-family: var(--display); font-size: 1.1rem;
      font-weight: 700; font-variation-settings: 'opsz' 144; letter-spacing: -0.02em;
    }
    .topbar .logo-mark {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, var(--accent-red-bright), var(--accent-red) 55%, var(--accent-red-deep));
      box-shadow: 0 0 0 3px rgba(209, 52, 51, 0.12);
    }
    .topbar .topbar-title {
      font-size: var(--type-sm); color: var(--text-secondary); font-weight: 500;
      border-left: 1px solid var(--border); padding-left: var(--space-4);
    }
    .sidebar-toggle {
      display: none; align-items: center; justify-content: center; gap: var(--space-2);
      min-height: 40px; min-width: 40px; padding: 0 var(--space-3);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill);
      color: var(--text-primary); font-family: var(--body); font-size: var(--type-base); font-weight: 600;
      cursor: pointer;
    }
    .sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .topbar-spacer { height: var(--topbar-h); }

    /* Language switch — segmented pill */
    .lang-switch {
      display: inline-flex; align-items: center; gap: 2px; margin-left: auto;
      padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.6);
    }
    .lang-btn {
      border: none; background: transparent; cursor: pointer;
      padding: 5px 12px; border-radius: var(--radius-pill);
      font-family: var(--body); font-size: var(--type-xs); font-weight: 600;
      letter-spacing: 0.04em; color: var(--text-secondary);
      transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .lang-btn:hover { color: var(--text-primary); }
    .lang-btn.active { background: var(--grad-ink); color: var(--white); }
    .lang-btn:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 1px; }

    /* ===== LAYOUT ===== */
    .app-layout { display: flex; min-height: calc(100vh - var(--topbar-h)); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--sidebar-bg) 30%);
      border-right: 1px solid var(--border); overflow-y: auto;
      position: fixed; top: var(--topbar-h); bottom: 0;
      padding: var(--space-4) 0 var(--space-6);
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar__search { position: relative; padding: 0 var(--space-4) var(--space-3); }
    .sidebar__search .search-icon {
      position: absolute; left: calc(var(--space-4) + 10px); top: 10px;
      color: var(--text-muted); pointer-events: none; display: flex;
    }
    .sidebar__search input {
      width: 100%; padding: 9px 34px 9px 34px; border: 1px solid var(--border-input);
      border-radius: var(--radius-pill); background: var(--surface);
      font-family: var(--body); font-size: var(--type-base); color: var(--text-primary);
    }
    .sidebar__search input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .sidebar__search .search-clear {
      position: absolute; right: calc(var(--space-4) + 6px); top: 8px;
      background: none; border: none; cursor: pointer; color: var(--text-secondary);
      display: flex; padding: 4px; border-radius: var(--radius-sm);
    }
    .sidebar__search .search-clear:hover { color: var(--accent-red); background: var(--accent-red-light); }
    .sidebar-group { margin-bottom: var(--space-2); }
    .sidebar-group__head {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-5); font-size: var(--type-xs); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary);
    }
    .sidebar-category { margin-bottom: var(--space-1); }
    .sidebar-category-header {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: none; border: none; cursor: pointer;
      padding: var(--space-2) var(--space-5); font-family: var(--body);
      font-size: var(--type-xs); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-secondary);
      transition: color var(--dur-fast) var(--ease);
    }
    .sidebar-category-header:hover { color: var(--text-primary); }
    .sidebar-category-header .arrow { display: flex; transition: transform var(--dur) var(--ease); }
    .sidebar-category-header.collapsed .arrow { transform: rotate(-90deg); }
    .sidebar-category-header .cat-icon { display: flex; align-items: center; gap: var(--space-2); }
    .sidebar-category-items.collapsed { display: none; }
    .sidebar-row { display: flex; align-items: center; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
      padding: 7px var(--space-2) 7px var(--space-4); font-size: var(--type-base);
      color: var(--text-secondary); cursor: pointer; border: none; background: none;
      text-align: left; font-family: var(--body);
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .sidebar-item__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-item:hover { background: rgba(31, 76, 130, 0.07); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--surface); color: var(--text-primary); font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent-red), 0 2px 10px rgba(27, 28, 32, 0.05);
    }
    .sidebar-item .icon { display: flex; flex-shrink: 0; }
    .sidebar-star {
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 6px var(--space-4) 6px 0; display: flex; opacity: 0;
      transition: opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .sidebar-row:hover .sidebar-star, .sidebar-star[aria-pressed="true"] { opacity: 1; }
    .sidebar-star:hover { color: var(--amber); }
    .sidebar-star[aria-pressed="true"] { color: var(--amber); }
    .sidebar-star:focus-visible { opacity: 1; outline: 2px solid var(--ink-blue); outline-offset: -2px; border-radius: var(--radius-sm); }
    .sidebar-empty { padding: var(--space-4) var(--space-5); font-size: var(--type-base); color: var(--text-secondary); }
    .sidebar-empty p { margin-bottom: var(--space-2); }
    .sidebar-empty .closest-label { font-weight: 600; color: var(--text-primary); }
    .sidebar-empty .closest { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
    .sidebar-empty .closest button {
      border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer;
      border-radius: var(--radius-pill); padding: 5px 12px; font-family: var(--body);
      font-size: var(--type-sm); color: var(--accent);
    }
    .sidebar-empty .closest button:hover { border-color: var(--accent); background: var(--ink-blue-light); }
    .sidebar-backdrop {
      display: none; position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 150;
      background: var(--scrim); border: none;
    }

    /* ===== MAIN ===== */
    .main {
      margin-left: var(--sidebar-w); flex: 1; padding: var(--space-6) 44px var(--space-8);
      min-height: calc(100vh - var(--topbar-h));
      background:
        radial-gradient(1100px 480px at 88% -12%, rgba(31, 76, 130, 0.05), transparent 60%),
        radial-gradient(900px 420px at -8% 110%, rgba(209, 52, 51, 0.045), transparent 60%);
    }

    /* ===== TOOL PANEL (the one skeleton every tool uses) ===== */
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }
    .tool-panel__head {
      display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-4);
      align-items: start; margin-bottom: var(--space-5);
    }
    .tool-panel__icon {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: var(--radius-md);
      background: var(--ink-blue-light); color: var(--accent); flex-shrink: 0;
    }
    .tool-panel__heading h2 {
      font-family: var(--display); font-size: var(--type-xl); font-weight: 700;
      font-variation-settings: 'opsz' 144; line-height: 1.2; margin-bottom: 6px;
    }
    .tool-panel__blurb { color: var(--text-secondary); font-size: var(--type-md); line-height: 1.6; max-width: 70ch; }
    .tool-panel__blurb a { color: var(--ink-blue); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      padding: 5px 12px; border-radius: var(--radius-pill);
      font-size: var(--type-xs); font-weight: 600; letter-spacing: 0.02em;
      border: 1px solid var(--border);
    }
    .badge--browser { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .badge--server { background: var(--amber-soft); border-color: var(--border-strong); color: var(--warning); }
    .tool-panel__foot { margin-top: var(--space-5); display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }

    /* ===== UPLOAD ZONE ===== */
    .upload-zone {
      position: relative; overflow: hidden;
      border: 2px dashed var(--border-strong); border-radius: var(--radius-lg); padding: 56px var(--space-5);
      text-align: center; cursor: pointer;
      background:
        radial-gradient(420px 200px at 50% -5%, rgba(31, 76, 130, 0.07), transparent 70%),
        linear-gradient(180deg, var(--surface-raised), var(--surface));
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), transform var(--dur) var(--ease);
    }
    .upload-zone::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(320px 170px at 50% 0%, rgba(31, 76, 130, 0.13), transparent 75%);
      transition: opacity 0.25s var(--ease);
    }
    .upload-zone:hover::before, .upload-zone.drag-over::before { opacity: 1; }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--ink-blue); box-shadow: 0 12px 30px -18px rgba(31, 76, 130, 0.5);
      transform: translateY(-2px);
    }
    .upload-zone.drag-over { background: var(--ink-blue-light); }
    .upload-zone .upload-icon {
      width: 64px; height: 64px; margin: 0 auto var(--space-4);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); border-radius: 50%;
      background: linear-gradient(135deg, var(--ink-blue-light), rgba(209, 52, 51, 0.1));
      box-shadow: 0 8px 20px -10px rgba(31, 76, 130, 0.45), inset 0 0 0 1px rgba(31, 76, 130, 0.1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .upload-zone:hover .upload-icon { transform: translateY(-4px) scale(1.06); }
    .upload-zone p { font-size: var(--type-md); color: var(--text-secondary); }
    .upload-zone .upload-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: var(--space-4); padding: 10px 26px;
      background: var(--grad-ink); color: var(--white); border-radius: var(--radius-pill);
      font-size: var(--type-base); font-weight: 600; cursor: pointer; border: none;
      font-family: var(--body);
      box-shadow: 0 8px 18px -8px rgba(31, 76, 130, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: transform 0.18s var(--ease), filter 0.18s var(--ease);
    }
    .upload-zone .upload-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone.multi { padding: 40px var(--space-5); }

    /* ===== FILE LIST ===== */
    .file-list { margin-top: var(--space-4); }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 10px 14px 10px 10px; margin-bottom: var(--space-2); gap: var(--space-3);
      transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }
    .file-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .file-item .file-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .file-item .file-icon {
      width: 36px; height: 36px; flex-shrink: 0; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      background: var(--ink-blue-light); border-radius: 10px;
    }
    .file-item .file-name { font-size: var(--type-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .file-size {
      font-size: var(--type-xs); font-weight: 600; color: var(--text-secondary);
      background: rgba(27, 28, 32, 0.05); padding: 3px 9px; border-radius: var(--radius-pill); flex-shrink: 0;
    }
    .file-item .file-remove {
      background: none; border: none; cursor: pointer; color: var(--text-secondary);
      padding: 2px var(--space-2); border-radius: var(--radius-sm); line-height: 1;
      display: flex; transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .file-item .file-remove:hover { color: var(--accent-red); background: var(--accent-red-light); }

    /* ===== CONTROLS ===== */
    .tool-controls {
      margin-top: var(--space-4); padding: var(--space-5) var(--space-5) var(--space-4);
      background: linear-gradient(180deg, var(--surface-raised), var(--surface));
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .tool-controls label { display: block; font-size: var(--type-xs); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 7px; color: var(--label); }
    .tool-controls .control-row { display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--space-4); }
    .tool-controls .control-row:last-child { margin-bottom: 2px; }
    .tool-controls .control-group { display: flex; flex-direction: column; gap: var(--space-1); }
    .tool-controls .control-group.grow { flex: 1; min-width: 220px; }
    .tool-controls select,
    .tool-controls input[type="text"],
    .tool-controls input[type="number"],
    .tool-controls input[type="password"],
    .tool-controls textarea {
      padding: 9px 12px; border: 1px solid var(--border-input); border-radius: 10px;
      font-family: var(--body); font-size: var(--type-base); background: var(--surface);
      color: var(--text-primary); min-width: 120px;
      transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }
    .tool-controls textarea { resize: vertical; }
    .tool-controls .tool-textarea { width: 100%; min-height: 170px; font-family: var(--mono); font-size: var(--type-sm); line-height: 1.6; }
    .tool-controls select:focus,
    .tool-controls input:focus,
    .tool-controls textarea:focus { outline: none; border-color: var(--ink-blue); box-shadow: var(--ring); }
    .tool-controls .hint { font-size: var(--type-sm); color: var(--text-secondary); line-height: 1.6; }
    .tool-controls .hint code { font-family: var(--mono); background: rgba(27, 28, 32, 0.06); padding: 1px 5px; border-radius: 5px; }
    .tool-controls .check { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tool-controls .check input { width: 17px; height: 17px; accent-color: var(--accent); }
    .tool-controls .check label { text-transform: none; letter-spacing: 0; font-size: var(--type-base); font-weight: 500; color: var(--text-primary); margin: 0; }
    .tool-controls .color-picker-wrap { display: flex; align-items: center; gap: var(--space-2); }
    .tool-controls input[type="color"] {
      width: 38px; height: 38px; border: 1px solid var(--border-input); border-radius: 50%;
      cursor: pointer; padding: 3px; background: var(--surface);
      transition: transform var(--dur-fast) var(--ease), box-shadow 0.18s var(--ease);
    }
    .tool-controls input[type="color"]:hover { transform: scale(1.06); box-shadow: var(--ring); }
    .tool-controls input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    .tool-controls input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }

    /* ===== BUTTONS ===== */
    .btn-primary {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 12px 28px; background: var(--grad-ink); color: var(--white); border: none; border-radius: var(--radius-pill);
      font-family: var(--body); font-size: 0.9rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 22px -10px rgba(31, 76, 130, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s var(--ease);
    }
    .btn-primary::after {
      content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg); opacity: 0;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(31, 76, 130, 0.75); }
    .btn-primary:hover:not(:disabled)::after { opacity: 1; animation: uiverse-sweep 0.9s var(--ease); }
    .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    @keyframes uiverse-sweep { to { left: 120%; } }
    .btn-secondary, .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 11px 26px; background: transparent; color: var(--ink-blue);
      border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
      font-family: var(--body); font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .btn-secondary:hover, .btn-ghost:hover { border-color: var(--ink-blue); background: var(--ink-blue-light); transform: translateY(-1px); }
    .btn-ghost { padding: 7px 14px; font-size: var(--type-sm); border-color: var(--border-input); }

    /* ===== PROGRESS + STATUS ===== */
    .tool-status {
      margin-top: var(--space-4); padding: 14px 18px 14px 20px; border-radius: var(--radius-md);
      font-size: var(--type-base); display: none; line-height: 1.6; position: relative;
    }
    .tool-status.success { display: block; background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }
    .tool-status.error { display: block; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--accent-red); }
    .tool-status.info { display: block; background: var(--info-bg); border: 1px solid var(--info-border); color: var(--info-text); }
    .tool-status.success::before,
    .tool-status.error::before,
    .tool-status.info::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px;
      background: var(--success);
    }
    .tool-status.error::before { background: var(--accent-red); }
    .tool-status.info::before { background: var(--ink-blue); }
    .tool-status .status-row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; justify-content: space-between; }
    .tool-status .download-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: var(--space-3); padding: 9px 20px; background: var(--grad-ink); color: var(--white);
      border-radius: var(--radius-pill); text-decoration: none; font-size: var(--type-base); font-weight: 600;
      box-shadow: 0 6px 14px -8px rgba(31, 76, 130, 0.6);
      transition: filter var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .tool-status .download-link:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .tool-status .report { margin-top: var(--space-2); font-size: var(--type-sm); opacity: 0.9; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .progress { height: 6px; margin-top: var(--space-3); background: rgba(27, 28, 32, 0.1); border-radius: var(--radius-pill); overflow: hidden; }
    .progress__bar { display: block; height: 100%; width: 0; background: var(--grad-ink); border-radius: var(--radius-pill); transition: width var(--dur) var(--ease); }
    .progress--indeterminate .progress__bar { width: 35%; animation: progress-slide 1.3s var(--ease) infinite; }
    @keyframes progress-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    .progress-meta { display: flex; gap: var(--space-4); margin-top: 6px; font-size: var(--type-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* ===== PAGE LIST (reorder / advanced pages) ===== */
    .page-list { margin-top: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-3); }
    .page-item {
      background: var(--surface); border: 1px solid var(--border-input); border-radius: 10px;
      padding: var(--space-2) var(--space-3); font-size: var(--type-sm); cursor: grab; user-select: none;
      display: flex; align-items: center; gap: var(--space-1); box-shadow: var(--shadow-sm);
      transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .page-item:hover { border-color: var(--ink-blue); transform: translateY(-1px); }
    .page-item.dragging { opacity: 0.4; }
    .page-item .page-btn, .page-item .page-del {
      background: none; border: none; cursor: pointer; color: var(--text-secondary);
      padding: 2px 5px; border-radius: 6px; display: flex;
      transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .page-item .page-btn:hover { color: var(--ink-blue); background: var(--ink-blue-light); }
    .page-item .page-del:hover { color: var(--accent-red); background: var(--accent-red-light); }
    .page-item .page-num { font-weight: 600; }

    /* ===== PLACEHOLDER / FATAL ===== */
    .placeholder-card {
      background: linear-gradient(180deg, var(--surface-raised), var(--surface));
      border: 1px dashed var(--border-strong); border-radius: var(--radius-lg);
      padding: 44px var(--space-5); text-align: center; margin-top: var(--space-4);
    }
    .placeholder-card .pl-icon {
      width: 60px; height: 60px; margin: 0 auto 14px; color: var(--warning);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--amber-soft);
    }
    .placeholder-card h3 { font-family: var(--display); font-size: var(--type-lg); font-weight: 600; margin-bottom: var(--space-2); }
    .placeholder-card p { font-size: var(--type-base); color: var(--text-secondary); line-height: 1.6; max-width: 480px; margin: 0 auto; }
    .placeholder-card code { font-family: var(--mono); font-size: 0.8em; background: rgba(27, 28, 32, 0.06); padding: 1px 6px; border-radius: 5px; }

    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--white); border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast notifications */
    .toast {
      position: fixed; bottom: var(--space-5); left: 50%; transform: translateX(-50%);
      padding: var(--space-3) var(--space-5); border-radius: var(--radius-md);
      font-size: var(--type-base); font-weight: 500; z-index: 999;
      box-shadow: var(--shadow-lift); animation: toastIn 0.3s ease-out;
    }
    .toast.info { background: var(--text-primary); color: var(--white); }
    .toast.error { background: var(--accent-red); color: var(--white); }
    .toast.success { background: var(--success-text); color: var(--white); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ===== RESPONSIVE (off-canvas sidebar under 900px) ===== */
    @media (max-width: 900px) {
      .sidebar-toggle { display: inline-flex; }
      .sidebar {
        width: min(84vw, 320px); z-index: 200;
        transform: translateX(-102%); transition: transform var(--dur) var(--ease);
        box-shadow: var(--shadow-lift);
      }
      .sidebar.open { transform: none; }
      .sidebar-backdrop.open { display: block; }
      .main { margin-left: 0; padding: var(--space-5) var(--space-4) 60px; }
      .app-layout { flex-direction: column; }
      .tool-panel__head { grid-template-columns: auto 1fr; }
      .tool-panel__head .badge { grid-column: 2; justify-self: start; }
    }
    @media (max-width: 520px) {
      .main { padding: var(--space-4) var(--space-3) 60px; }
      .upload-zone { padding: 36px var(--space-4); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .spinner { animation: none; }
      .progress--indeterminate .progress__bar { width: 100%; animation: none; }
    }
  </style>
</head>
<body data-title-key="ap.page.title">
  <!-- TOP BAR -->
  <header class="topbar">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Show the tools" data-i18n-aria="ap.sidebar.toggle">
      <span data-icon="menu" data-icon-size="18"></span>
      <span data-i18n="ap.top.tools">Tools</span>
    </button>
    <a href="index.html" class="logo" aria-label="Folio home" data-i18n-aria="ap.logo.aria"><span class="logo-mark"></span>Folio</a>
    <span class="topbar-title" data-i18n="ap.top.title">PDF Editor</span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" class="lang-btn" data-lang="it" aria-pressed="false">IT</button>
    </div>
  </header>
  <div class="topbar-spacer"></div>

  <div class="app-layout">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar" data-i18n-aria="ap.sidebar.aria" aria-label="Tools">
      <div class="sidebar__search">
        <span class="search-icon" data-icon="search" data-icon-size="16"></span>
        <label class="sr-only" for="tool-search" data-i18n="ap.search.aria">Search tools</label>
        <input type="search" id="tool-search" autocomplete="off" placeholder="Search tools…" data-i18n-placeholder="ap.search.placeholder" />
        <button type="button" class="search-clear" id="tool-search-clear" hidden aria-label="Clear the search" data-i18n-aria="ap.search.clear">
          <span data-icon="close" data-icon-size="14"></span>
        </button>
      </div>
      <div class="sidebar__pinned" id="sidebar-pinned"></div>
      <div class="sidebar__categories" id="sidebar-categories"></div>
      <div class="sidebar-empty" id="sidebar-empty" hidden></div>
    </nav>
    <button type="button" class="sidebar-backdrop" id="sidebar-backdrop" hidden tabindex="-1" aria-label="Close the tool list" data-i18n-aria="ap.sidebar.close"></button>

    <!-- MAIN -->
    <main class="main" id="main">
      <!-- Tool panels injected by JS -->
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="server-tools.js"></script>
  <script>
  // pdf-lib is vendored locally (vendor/pdf-lib.min.js). Guard anyway so a
  // blocked/missing script never blanks the whole app.
  const PDFLIB = typeof PDFLib !== 'undefined' ? PDFLib : null;
  const hasPDFLib = !!PDFLIB;
  const { PDFDocument, StandardFonts, rgb, degrees, PDFName, PDFDict, PDFArray } = PDFLIB || {};
  const icon = (name, opts) => (window.folioIcon ? window.folioIcon(name, opts) : '');
  const t = (key, vars) => FolioI18N.t(key, vars);

  // ===== SAFE STORAGE =====
  // localStorage throws in private mode and some file:// contexts; the
  // in-memory copy keeps favourites and recents working for the session.
  const store = (function () {
    const mem = {};
    return {
      get(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          if (raw !== null) return JSON.parse(raw);
        } catch (e) { /* storage unavailable */ }
        return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : fallback;
      },
      set(key, value) {
        mem[key] = value;
        try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
      },
    };
  })();

  const KEY_FAVS = 'folio-favourites';
  const KEY_RECENTS = 'folio-recents';

  // ===== TOOL DEFINITIONS =====
  // icon   -> name in the shared set (icons.js)
  // type   -> 'browser' (runs here) | 'server' (/api/tools/<id>)
  function CATEGORIES() {
    return [
      {
        id: 'organize', name: t('ap.cat.organize'), icon: 'layers',
        tools: [
          { id: 'merge', label: t('ap.t.merge.label'), icon: 'merge', desc: t('ap.t.merge.desc'), type: 'browser' },
          { id: 'split', label: t('ap.t.split.label'), icon: 'split', desc: t('ap.t.split.desc'), type: 'browser' },
          { id: 'remove-pages', label: t('ap.t.remove-pages.label'), icon: 'pages-remove', desc: t('ap.t.remove-pages.desc'), type: 'browser' },
          { id: 'extract-pages', label: t('ap.t.extract-pages.label'), icon: 'pages-extract', desc: t('ap.t.extract-pages.desc'), type: 'browser' },
          { id: 'reorder', label: t('ap.t.reorder.label'), icon: 'reorder', desc: t('ap.t.reorder.desc'), type: 'browser' },
          { id: 'advanced-pages', label: t('ap.t.advanced-pages.label'), icon: 'layers', desc: t('ap.t.advanced-pages.desc'), type: 'browser' },
          { id: 'scan', label: t('ap.t.scan.label'), icon: 'scan', desc: t('ap.t.scan.desc'), type: 'server' },
        ],
      },
      {
        id: 'optimize', name: t('ap.cat.optimize'), icon: 'zap',
        tools: [
          { id: 'compress', label: t('ap.t.compress.label'), icon: 'compress', desc: t('ap.t.compress.desc'), type: 'server' },
          { id: 'repair', label: t('ap.t.repair.label'), icon: 'repair', desc: t('ap.t.repair.desc'), type: 'server' },
          { id: 'ocr', label: t('ap.t.ocr.label'), icon: 'text-recognize', desc: t('ap.t.ocr.desc'), type: 'server' },
          { id: 'deskew', label: t('ap.t.deskew.label'), icon: 'deskew', desc: t('ap.t.deskew.desc'), type: 'server' },
          { id: 'sanitize', label: t('ap.t.sanitize.label'), icon: 'sanitize', desc: t('ap.t.sanitize.desc'), type: 'browser' },
        ],
      },
      {
        id: 'to-pdf', name: t('ap.cat.toPdf'), icon: 'arrow-left',
        tools: [
          { id: 'jpg-to-pdf', label: t('ap.t.jpg-to-pdf.label'), icon: 'image', desc: t('ap.t.jpg-to-pdf.desc'), type: 'browser' },
          { id: 'word-to-pdf', label: t('ap.t.word-to-pdf.label'), icon: 'file-text', desc: t('ap.t.word-to-pdf.desc'), type: 'server' },
          { id: 'ppt-to-pdf', label: t('ap.t.ppt-to-pdf.label'), icon: 'presentation', desc: t('ap.t.ppt-to-pdf.desc'), type: 'server' },
          { id: 'excel-to-pdf', label: t('ap.t.excel-to-pdf.label'), icon: 'sheet', desc: t('ap.t.excel-to-pdf.desc'), type: 'server' },
          { id: 'html-to-pdf', label: t('ap.t.html-to-pdf.label'), icon: 'globe', desc: t('ap.t.html-to-pdf.desc'), type: 'browser' },
        ],
      },
      {
        id: 'from-pdf', name: t('ap.cat.fromPdf'), icon: 'arrow-right',
        tools: [
          { id: 'pdf-to-jpg', label: t('ap.t.pdf-to-jpg.label'), icon: 'image', desc: t('ap.t.pdf-to-jpg.desc'), type: 'server' },
          { id: 'pdf-to-word', label: t('ap.t.pdf-to-word.label'), icon: 'file-text', desc: t('ap.t.pdf-to-word.desc'), type: 'server' },
          { id: 'pdf-to-ppt', label: t('ap.t.pdf-to-ppt.label'), icon: 'presentation', desc: t('ap.t.pdf-to-ppt.desc'), type: 'server' },
          { id: 'pdf-to-excel', label: t('ap.t.pdf-to-excel.label'), icon: 'sheet', desc: t('ap.t.pdf-to-excel.desc'), type: 'server' },
          { id: 'pdf-to-pdfa', label: t('ap.t.pdf-to-pdfa.label'), icon: 'archive', desc: t('ap.t.pdf-to-pdfa.desc'), type: 'server' },
          { id: 'pdf-to-html', label: t('ap.t.pdf-to-html.label'), icon: 'globe', desc: t('ap.t.pdf-to-html.desc'), type: 'server' },
          { id: 'pdf-to-markdown', label: t('ap.t.pdf-to-markdown.label'), icon: 'file-text', desc: t('ap.t.pdf-to-markdown.desc'), type: 'server' },
          { id: 'extract-text', label: t('ap.t.extract-text.label'), icon: 'text-recognize', desc: t('ap.t.extract-text.desc'), type: 'server' },
        ],
      },
      {
        id: 'edit', name: t('ap.cat.edit'), icon: 'pen',
        tools: [
          { id: 'rotate', label: t('ap.t.rotate.label'), icon: 'rotate', desc: t('ap.t.rotate.desc'), type: 'browser' },
          { id: 'page-numbers', label: t('ap.t.page-numbers.label'), icon: 'hash', desc: t('ap.t.page-numbers.desc'), type: 'browser' },
          { id: 'header-footer', label: t('ap.t.header-footer.label'), icon: 'header-footer', desc: t('ap.t.header-footer.desc'), type: 'browser' },
          { id: 'watermark', label: t('ap.t.watermark.label'), icon: 'watermark', desc: t('ap.t.watermark.desc'), type: 'browser' },
          { id: 'crop', label: t('ap.t.crop.label'), icon: 'crop', desc: t('ap.t.crop.desc'), type: 'browser' },
          { id: 'edit-text', label: t('ap.t.edit-text.label'), icon: 'pen', desc: t('ap.t.edit-text.desc'), type: 'browser' },
          { id: 'forms', label: t('ap.t.forms.label'), icon: 'forms', desc: t('ap.t.forms.desc'), type: 'server' },
        ],
      },
      {
        id: 'protect', name: t('ap.cat.protect'), icon: 'shield',
        tools: [
          { id: 'unlock', label: t('ap.t.unlock.label'), icon: 'unlock', desc: t('ap.t.unlock.desc'), type: 'server' },
          { id: 'protect', label: t('ap.t.protect.label'), icon: 'lock', desc: t('ap.t.protect.desc'), type: 'server' },
          { id: 'sign', label: t('ap.t.sign.label'), icon: 'signature', desc: t('ap.t.sign.desc'), type: 'server' },
          { id: 'redact', label: t('ap.t.redact.label'), icon: 'redact', desc: t('ap.t.redact.desc'), type: 'server' },
          { id: 'compare', label: t('ap.t.compare.label'), icon: 'compare', desc: t('ap.t.compare.desc'), type: 'server' },
        ],
      },
    ];
  }

  function ALL_TOOLS() {
    const out = [];
    CATEGORIES().forEach((cat) => cat.tools.forEach((tool) => out.push(tool)));
    return out;
  }
  function findTool(id) { return ALL_TOOLS().filter((tool) => tool.id === id)[0] || null; }
  function categoryOf(id) {
    const cats = CATEGORIES();
    for (let i = 0; i < cats.length; i++) {
      if (cats[i].tools.some((tool) => tool.id === id)) return cats[i];
    }
    return null;
  }

  // ===== STATUS / PROGRESS / RUN HELPERS =====
  function showStatus(statusId, type, message, extra) {
    const el = document.getElementById(statusId);
    if (!el) return;
    el.className = 'tool-status ' + type;
    // Errors are announced immediately, progress and results politely.
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
    el.innerHTML = message + (extra || '');
  }

  function clearStatus(statusId) {
    const el = document.getElementById(statusId);
    if (el) { el.style.display = 'none'; el.innerHTML = ''; el.className = 'tool-status'; }
  }

  /* Failure with a Retry button that re-runs exactly the same request. */
  function showFailure(statusId, message, retry) {
    showStatus(statusId, 'error', message);
    const el = document.getElementById(statusId);
    if (!el) return;
    const row = document.createElement('div');
    row.className = 'status-row';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-ghost';
    btn.innerHTML = icon('refresh', { size: 14 }) + '<span>' + t('ap.retry') + '</span>';
    btn.addEventListener('click', () => { clearStatus(statusId); retry(); });
    row.appendChild(btn);
    el.appendChild(row);
  }

  /* A run in progress: elapsed time, a bar, and a Cancel button. The task
     decides whether the bar is determinate (browser tools, page by page) or
     indeterminate (server tools, where the work happens remotely). */
  function createRun(statusId, label, opts) {
    const el = document.getElementById(statusId);
    const started = Date.now();
    const state = { cancelled: false, onCancel: null, indeterminate: !(opts && opts.determinate) };
    if (!el) return { set() {}, cancelled: false };
    el.className = 'tool-status info';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.innerHTML =
      '<div class="progress-row"><span class="progress-label"></span>' +
      '<button type="button" class="btn-ghost progress-cancel">' + icon('close', { size: 14 }) + '<span>' + t('ap.progress.cancel') + '</span></button></div>' +
      '<div class="progress' + (state.indeterminate ? ' progress--indeterminate' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="progress__bar"></span></div>' +
      '<div class="progress-meta"><span class="progress-elapsed">' + t('ap.progress.elapsed') + ' 0.0s</span><span class="progress-step"></span></div>';
    const bar = el.querySelector('.progress__bar');
    const barWrap = el.querySelector('.progress');
    const labelEl = el.querySelector('.progress-label');
    const stepEl = el.querySelector('.progress-step');
    const elapsedEl = el.querySelector('.progress-elapsed');
    labelEl.textContent = label || '';
    const tick = window.setInterval(() => {
      elapsedEl.textContent = t('ap.progress.elapsed') + ' ' + ((Date.now() - started) / 1000).toFixed(1) + 's';
    }, 200);
    el.querySelector('.progress-cancel').addEventListener('click', () => {
      state.cancelled = true;
      if (state.onCancel) state.onCancel();
      stepEl.textContent = t('ap.progress.cancelled');
    });
    return {
      get cancelled() { return state.cancelled; },
      onCancel(fn) { state.onCancel = fn; },
      set(percent, step) {
        if (state.cancelled) return;
        if (typeof percent === 'number') {
          barWrap.classList.remove('progress--indeterminate');
          bar.style.width = Math.max(0, Math.min(100, percent)) + '%';
          barWrap.setAttribute('aria-valuenow', String(Math.round(percent)));
        }
        if (step !== undefined) stepEl.textContent = step;
      },

  function setupUpload(cfg) {
    const input = document.getElementById(cfg.inputId);
    const zone = document.getElementById(cfg.zoneId);
    const list = document.getElementById(cfg.listId);
    if (!input || !zone || !list) return;
    let selected = [];

    function renderList() {
      list.innerHTML = '';
      selected.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        const info = document.createElement('div');
        info.className = 'file-info';
        info.innerHTML = '<span class="file-icon">' + icon('file', { size: 18 }) + '</span>' +
          '<span class="file-name"></span>' +
          '<span class="file-size">' + (file.size / 1024).toFixed(1) + ' KB</span>';
        info.querySelector('.file-name').textContent = file.name;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'file-remove';
        remove.setAttribute('aria-label', t('ap.retry'));
        remove.innerHTML = icon('close', { size: 16 });
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          selected.splice(index, 1);
          if (cfg.onFiles) cfg.onFiles(selected);
          renderList();
        });
        div.appendChild(info);
        div.appendChild(remove);
        list.appendChild(div);
      });
    }

    function handleFiles(files) {
      selected = Array.prototype.slice.call(files);
      if (cfg.onFiles) cfg.onFiles(selected);
      renderList();
    }

    input.addEventListener('change', () => handleFiles(input.files));
    zone.addEventListener('click', (e) => { if (!e.target.closest('.file-remove')) input.click(); });
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  }

  function getFileName(file) { return String(file.name || 'document').replace(/\.[^/.]+$/, ''); }
  async function readFileAsBytes(file) { return new Uint8Array(await file.arrayBuffer()); }

  function parsePageRange(input, totalPages) {
    const pages = new Set();
    String(input || '').split(',').map((s) => s.trim()).forEach((part) => {
      if (part.indexOf('-') >= 0) {
        const bounds = part.split('-').map((s) => parseInt(s.trim(), 10));
        if (!isNaN(bounds[0]) && !isNaN(bounds[1])) {
          for (let i = bounds[0]; i <= bounds[1]; i++) pages.add(i);
        }
      } else {
        const n = parseInt(part, 10);
        if (!isNaN(n)) pages.add(n);
      }
    });
    return Array.from(pages).filter((n) => n >= 1 && n <= totalPages).sort((a, b) => a - b);
  }

  function downloadBlob(bytes, filename, mime) {
    const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type: mime || 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    // Append to the document (required by Firefox) and revoke only after the
    // download has had time to start, otherwise the click is silently dropped.
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function downloadPDF(bytes, filename) { downloadBlob(bytes, filename, 'application/pdf'); }

  // Build the object URL for the "Download" links shown in status messages
  // and revoke it later, so repeated operations do not leak blob memory.
  function objectUrl(bytes, mime) {
    const url = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/pdf' }));
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return url;
  }
  function downloadLink(url, name, label) {
    return '<br/><a class="download-link" href="' + url + '" download="' + name + '">' + icon('download', { size: 15 }) + (label || t('ap.download')) + '</a>';
  }
  function hexToRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16) / 255,
      g: parseInt(hex.slice(3, 5), 16) / 255,
      b: parseInt(hex.slice(5, 7), 16) / 255,
    };
  }

  // ===== BLANK PAGE DETECTION (used by Advanced pages) =====
  // A page counts as blank when it has no content stream at all, or when the
  // decoded stream contains no visible drawing operator: no text show, no
  // image, no path painting, no shading. Comments and string literals are
  // stripped first, so a page whose only text is an empty string is blank too.
  const VISIBLE_OP = /(^|[\s\]>])(Tj|TJ|'|"|Do|sh|BI|S|s|f\*|f|F|B\*|B|b\*|b)(?=[\s\[]|$)/;

  function latin1(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i += 4096) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
    }
    return out;
  }

  /* A page's content stream, decoded. `known` stays false when the filter is
     one we cannot undo, so the caller never calls such a page blank. */
  function streamText(stream) {
    if (!stream) return { text: '', known: false };
    try {
      return { text: latin1(PDFLIB.decodePDFRawStream(stream).decode()), known: true };
    } catch (e) {
      try {
        const raw = String(stream.getContentsString());
        // An uncompressed stream is plain text; a compressed one is not, and
        // pretending it is would report real pages as blank.
        return { text: raw, known: /^[\x09\x0a\x0d\x20-\x7e]*$/.test(raw) };
      } catch (e2) {
        return { text: '', known: false };
      }
    }
  }

  function pageIsBlank(page) {
    if (!PDFLIB || !PDFLIB.decodePDFRawStream) return false;
    const streams = [];
    const visit = (obj) => {
      if (!obj) return;
      if (PDFArray && obj instanceof PDFArray) { obj.asArray().forEach(visit); return; }
      const resolved = page.node.context.lookup(obj);
      if (resolved) streams.push(resolved);
    };
    visit(page.node.Contents());
    if (!streams.length) return true;
    let content = '';
    for (const s of streams) {
      const read = streamText(s);
      if (!read.known) return false;
      content += read.text + '\n';
    }
    const visible = content
      .replace(/%[^\n\r]*/g, ' ')
      .replace(/\((?:\\.|[^\\()])*\)/g, '()');
    return !VISIBLE_OP.test(visible);
  }

  // --- SPLIT ---
  function initSplit() {
    let file = null;
    const btn = document.getElementById('split-btn');
    setupUpload({
      inputId: 'split-input', listId: 'file-list-split-input', zoneId: 'upload-split-input',
      onFiles: (f) => {
        file = f[0];
        btn.disabled = false;
        document.getElementById('split-controls').style.display = '';
      },
    });
    document.getElementById('split-mode').addEventListener('change', () => {
      const mode = document.getElementById('split-mode').value;
      document.getElementById('split-range-group').style.display = mode === 'range' ? '' : 'none';
      document.getElementById('split-every-group').style.display = mode === 'every' ? '' : 'none';
    });
    async function run() {
      if (!file) { showStatus('split-status', 'error', t('ap.err.noFile')); return; }
      clearStatus('split-status');
      const current = document.getElementById('split-btn');
      setBusy(current, t('ap.split.busy'));
      const task = createRun('split-status', t('ap.split.busy'), { determinate: true });
      try {
        const bytes = await readFileAsBytes(file);
        const srcDoc = await PDFDocument.load(bytes);
        const total = srcDoc.getPageCount();
        const mode = document.getElementById('split-mode').value;
        const parts = [];
        if (mode === 'range') {
          const range = document.getElementById('split-range').value;
          if (!range) throw new Error(t('ap.split.errRange'));
          const pages = parsePageRange(range, total);
          if (!pages.length) throw new Error(t('ap.split.errNoPages', { n: total }));
          const partDoc = await PDFDocument.create();
          const refs = await partDoc.copyPages(srcDoc, pages.map((p) => p - 1));
          refs.forEach((p) => partDoc.addPage(p));
          parts.push({ doc: partDoc, name: getFileName(file) + '_pages_' + pages[0] + '-' + pages[pages.length - 1] + '.pdf' });
        } else {
          const every = parseInt(document.getElementById('split-every').value, 10) || 2;
          for (let start = 0; start < total; start += every) {
            checkpoint(task);
            task.set((start / total) * 100, '');
            const partDoc = await PDFDocument.create();
            const indices = [];
            for (let i = start; i < Math.min(start + every, total); i++) indices.push(i);
            const refs = await partDoc.copyPages(srcDoc, indices);
            refs.forEach((p) => partDoc.addPage(p));
            parts.push({ doc: partDoc, name: getFileName(file) + '_part_' + (Math.floor(start / every) + 1) + '.pdf' });
          }
        }
        for (const part of parts) {
          checkpoint(task);
          downloadPDF(await part.doc.save(), part.name);
        }
        task.set(100, '');
        showStatus('split-status', 'success', t('ap.split.ok', { n: parts.length }));
      } catch (e) {
        await failOrCancel('split-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }

  // --- REORDER ---
  function initReorder() {
    let file = null;
    let pageOrder = [];
    const btn = document.getElementById('reorder-btn');
    setupUpload({
      inputId: 'reorder-input', listId: 'file-list-reorder-input', zoneId: 'upload-reorder-input',
      onFiles: async (f) => {
        file = f[0];
        const doc = await PDFDocument.load(await readFileAsBytes(file));
        pageOrder = Array.from({ length: doc.getPageCount() }, (_, i) => i);
        renderList();
        document.getElementById('reorder-controls').style.display = '';
        btn.disabled = false;
      },
    });
    function renderList() {
      const list = document.getElementById('reorder-page-list');
      list.innerHTML = '';
      pageOrder.forEach((origIdx, pos) => {
        const div = document.createElement('div');
        div.className = 'page-item';
        div.innerHTML = '<span class="page-num">#' + (origIdx + 1) + '</span>';
        if (pos > 0) {
          const up = document.createElement('button');
          up.type = 'button';
          up.className = 'page-btn';
          up.title = t('ap.reorder.up');
          up.setAttribute('aria-label', t('ap.reorder.up'));
          up.innerHTML = icon('arrow-up', { size: 14 });
          up.addEventListener('click', () => {
            const tmp = pageOrder[pos - 1];
            pageOrder[pos - 1] = pageOrder[pos];
            pageOrder[pos] = tmp;
            renderList();
          });
          div.appendChild(up);
        }
        if (pos < pageOrder.length - 1) {
          const down = document.createElement('button');
          down.type = 'button';
          down.className = 'page-btn';
          down.title = t('ap.reorder.down');
          down.setAttribute('aria-label', t('ap.reorder.down'));
          down.innerHTML = icon('arrow-down', { size: 14 });
          down.addEventListener('click', () => {
            const tmp = pageOrder[pos + 1];
            pageOrder[pos + 1] = pageOrder[pos];
            pageOrder[pos] = tmp;
            renderList();
          });
          div.appendChild(down);
        }
        list.appendChild(div);
      });
    }
    async function run() {
      if (!file) { showStatus('reorder-status', 'error', t('ap.err.noFile')); return; }

  // --- ADVANCED PAGES (duplicate / reverse / insert blank / remove blank) ---
  function initAdvancedPages() {
    let file = null;
    let totalPages = 0;
    const btn = document.getElementById('adv-btn');
    setupUpload({
      inputId: 'adv-input', listId: 'file-list-adv-input', zoneId: 'upload-adv-input',
      onFiles: async (f) => {
        file = f[0];
        const doc = await PDFDocument.load(await readFileAsBytes(file));
        totalPages = doc.getPageCount();
        document.getElementById('adv-total').textContent = totalPages;
        document.getElementById('adv-position').max = String(totalPages + 1);
        document.getElementById('adv-controls').style.display = '';
        btn.disabled = false;
      },
    });
    document.getElementById('adv-action').addEventListener('change', () => {
      const action = document.getElementById('adv-action').value;
      document.getElementById('adv-pages-group').style.display = action === 'duplicate' ? '' : 'none';
      document.getElementById('adv-position-group').style.display = action === 'insert' ? '' : 'none';
    });
    async function run() {
      if (!file) { showStatus('adv-status', 'error', t('ap.err.noFile')); return; }
      clearStatus('adv-status');
      const current = document.getElementById('adv-btn');
      setBusy(current, t('ap.adv.busy'));
      const task = createRun('adv-status', t('ap.adv.busy'), { determinate: true });
      try {
        const action = document.getElementById('adv-action').value;
        const srcDoc = await PDFDocument.load(await readFileAsBytes(file));
        const total = srcDoc.getPageCount();
        const out = await PDFDocument.create();
        let message = '';

        if (action === 'reverse') {
          for (let i = 0; i < total; i++) {
            checkpoint(task);
            task.set((i / total) * 100, '');
            const refs = await out.copyPages(srcDoc, [total - 1 - i]);
            refs.forEach((p) => out.addPage(p));
          }
          message = t('ap.adv.okReverse');
        } else if (action === 'duplicate') {
          const wanted = parsePageRange(document.getElementById('adv-pages').value, total);
          if (!wanted.length) throw new Error(t('ap.extract.errNoPages'));
          const wantedSet = wanted.map((n) => n - 1);
          for (let i = 0; i < total; i++) {
            checkpoint(task);
            task.set((i / total) * 100, '');
            const refs = await out.copyPages(srcDoc, [i]);
            refs.forEach((p) => out.addPage(p));
            if (wantedSet.indexOf(i) >= 0) {
              const again = await out.copyPages(srcDoc, [i]);
              again.forEach((p) => out.addPage(p));
            }
          }
          message = t('ap.adv.okDuplicate', { n: wanted.length });
        } else if (action === 'insert') {
          const position = Math.max(1, Math.min(total + 1, parseInt(document.getElementById('adv-position').value, 10) || 1));
          for (let i = 0; i < total; i++) {
            checkpoint(task);
            task.set((i / total) * 100, '');
            if (i === position - 1) {
              const size = srcDoc.getPage(i).getSize();
              out.addPage([size.width, size.height]);
            }
            const refs = await out.copyPages(srcDoc, [i]);
            refs.forEach((p) => out.addPage(p));
          }
          if (position === total + 1) {
            const size = srcDoc.getPage(total - 1).getSize();
            out.addPage([size.width, size.height]);
          }
          message = t('ap.adv.okInsert');
        } else {
          const blanks = [];
          for (let i = 0; i < total; i++) {
            checkpoint(task);
            task.set((i / total) * 100, '');
            if (pageIsBlank(srcDoc.getPage(i))) blanks.push(i);
          }
          if (!blanks.length) throw new Error(t('ap.adv.errNoBlank'));
          for (let i = 0; i < total; i++) {
            checkpoint(task);
            task.set((i / total) * 100, '');
            if (blanks.indexOf(i) >= 0) continue;
            const refs = await out.copyPages(srcDoc, [i]);
            refs.forEach((p) => out.addPage(p));
          }
          message = t('ap.adv.okRemove', { n: blanks.length });
        }

        const pdfBytes = await out.save();
        const name = getFileName(file) + '_pages.pdf';
        downloadPDF(pdfBytes, name);
        showStatus('adv-status', 'success', message + downloadLink(objectUrl(pdfBytes), name));
      } catch (e) {
        await failOrCancel('adv-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }

  // --- HEADER & FOOTER ---
  function initHeaderFooter() {
    let file = null;
    const btn = document.getElementById('hf-btn');
    setupUpload({
      inputId: 'hf-input', listId: 'file-list-hf-input', zoneId: 'upload-hf-input',
      onFiles: (f) => {
        file = f[0];
        document.getElementById('hf-controls').style.display = '';
        btn.disabled = false;
      },
    });
    document.getElementById('hf-pages').addEventListener('change', () => {
      document.getElementById('hf-range-group').style.display =
        document.getElementById('hf-pages').value === 'range' ? '' : 'none';
    });

    function fill(template, ctx) {
      return String(template || '').replace(/\{(n|total|date|title)\}/g, (m, key) => {
        if (key === 'n') return String(ctx.n);
        if (key === 'total') return String(ctx.total);
        if (key === 'date') return ctx.date;
        return ctx.title;
      });
    }

    async function run() {
      if (!file) { showStatus('hf-status', 'error', t('ap.err.noFile')); return; }
      const header = document.getElementById('hf-header').value.trim();
      const footer = document.getElementById('hf-footer').value.trim();
      if (!header && !footer) { showStatus('hf-status', 'error', t('ap.hf.errEmpty')); return; }
      clearStatus('hf-status');
      const current = document.getElementById('hf-btn');
      setBusy(current, t('ap.hf.busy'));
      const task = createRun('hf-status', t('ap.hf.busy'), { determinate: true });
      try {
        const size = parseInt(document.getElementById('hf-size').value, 10) || 10;
        const marginMm = parseInt(document.getElementById('hf-margin').value, 10) || 15;
        const mm2pt = 2.83465;
        const margin = marginMm * mm2pt;
        const align = document.getElementById('hf-align').value;
        const rangeMode = document.getElementById('hf-pages').value;
        const doc = await PDFDocument.load(await readFileAsBytes(file));
        const pages = doc.getPages();
        const wanted = rangeMode === 'range'
          ? parsePageRange(document.getElementById('hf-range').value, pages.length)
          : pages.map((_, i) => i + 1);
        if (!wanted.length) throw new Error(t('ap.extract.errNoPages'));
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const date = new Date().toLocaleDateString(FolioI18N.current() === 'it' ? 'it-IT' : 'en-GB');
        const title = doc.getTitle() || getFileName(file);

        for (let k = 0; k < wanted.length; k++) {
          checkpoint(task);
          task.set((k / wanted.length) * 100, '');
          const page = pages[wanted[k] - 1];
          const { width, height } = page.getSize();
          const ctx = { n: wanted[k], total: pages.length, date, title };
          const draw = (text, y) => {
            if (!text) return;
            const w = font.widthOfTextAtSize(text, size);
            const x = align === 'left' ? margin : align === 'right' ? width - margin - w : (width - w) / 2;
            page.drawText(text, { x, y, font, size, color: rgb(0.2, 0.2, 0.2) });
          };
          draw(fill(header, ctx), height - margin);
          draw(fill(footer, ctx), margin);
        }
        const pdfBytes = await doc.save();
        const name = getFileName(file) + '_header-footer.pdf';
        downloadPDF(pdfBytes, name);
        showStatus('hf-status', 'success', t('ap.hf.ok', { n: wanted.length }) + downloadLink(objectUrl(pdfBytes), name));
      } catch (e) {
        await failOrCancel('hf-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }

  // --- JPG TO PDF ---
  function initJpgToPdf() {
    let files = [];
    const btn = document.getElementById('jpg-btn');
    setupUpload({
      inputId: 'jpg-input', listId: 'file-list-jpg-input', zoneId: 'upload-jpg-input',
      onFiles: (f) => { files = f; document.getElementById('jpg-controls').style.display = ''; btn.disabled = files.length === 0; },
    });
    async function run() {
      if (!files.length) { showStatus('jpg-status', 'error', t('ap.jpg.errNone')); return; }
      clearStatus('jpg-status');
      const current = document.getElementById('jpg-btn');
      setBusy(current, t('ap.jpg.busy'));
      const task = createRun('jpg-status', t('ap.jpg.busy'), { determinate: true });
      try {
        const orientation = document.getElementById('jpg-orientation').value;
        const format = document.getElementById('jpg-format').value;
        const sizes = { A4: [595.28, 841.89], LETTER: [612, 792], A3: [841.89, 1190.55] };
        let size = sizes[format] || sizes.A4;
        let pw = size[0];
        let ph = size[1];
        if (orientation === 'landscape') { pw = size[1]; ph = size[0]; }
        const doc = await PDFDocument.create();
        for (let i = 0; i < files.length; i++) {
          checkpoint(task);
          task.set((i / files.length) * 100, files[i].name);
          const file = files[i];
          const imgBytes = await readFileAsBytes(file);
          let img;
          if (file.type === 'image/png' || /\.png$/i.test(file.name)) img = await doc.embedPng(imgBytes);
          else if (file.type === 'image/webp' || /\.webp$/i.test(file.name)) throw new Error(t('ap.jpg.errWebp'));
          else img = await doc.embedJpg(imgBytes);
          const scale = Math.min(pw / img.width, ph / img.height);
          const dw = img.width * scale;
          const dh = img.height * scale;
          const page = doc.addPage([pw, ph]);
          page.drawImage(img, { x: (pw - dw) / 2, y: (ph - dh) / 2, width: dw, height: dh });
        }
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, 'images.pdf');
        showStatus('jpg-status', 'success', t('ap.jpg.ok', { n: files.length }) + downloadLink(objectUrl(pdfBytes), 'images.pdf'));
      } catch (e) {
        await failOrCancel('jpg-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }

  // --- HTML TO PDF ---
  function initHtmlToPdf() {
    const btn = document.getElementById('html-btn');
    async function run() {
      const html = document.getElementById('html-input').value;
      if (!html) { showStatus('html-status', 'error', t('ap.html.errEmpty')); return; }
      clearStatus('html-status');
      const current = document.getElementById('html-btn');
      setBusy(current, t('ap.html.busy'));
      const task = createRun('html-status', t('ap.html.busy'), { determinate: true });
      try {
        const title = document.getElementById('html-title').value || t('ap.html.titleDefault');
        const doc = await PDFDocument.create();
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const fontBold = await doc.embedFont(StandardFonts.HelveticaBold);
        const pageSize = [595.28, 841.89];
        let page = doc.addPage(pageSize);
        const { width, height } = page.getSize();
        const lines = html.split('\n');
        const margin = 50;
        const maxW = width - margin * 2;
        let y = height - 60;
        for (let i = 0; i < lines.length; i++) {
          checkpoint(task);
          task.set((i / lines.length) * 100, '');
          if (y < 60) { page = doc.addPage(pageSize); y = height - 60; }
          const trimmed = lines[i].trim();
          if (!trimmed) { y -= 16; continue; }
          if (trimmed.indexOf('# ') === 0) {
            page.drawText(trimmed.slice(2), { x: margin, y, font: fontBold, size: 22, color: rgb(0.1, 0.1, 0.1) });
            y -= 32;
          } else if (trimmed.indexOf('## ') === 0) {
            page.drawText(trimmed.slice(3), { x: margin, y, font: fontBold, size: 16, color: rgb(0.15, 0.15, 0.15) });
            y -= 28;
          } else if (trimmed.indexOf('- ') === 0) {
            page.drawText('- ' + trimmed.slice(2), { x: margin + 12, y, font, size: 10, color: rgb(0.2, 0.2, 0.2) });
            y -= 22;
          } else {
            page.drawText(trimmed, { x: margin, y, font, size: 10, color: rgb(0.2, 0.2, 0.2), maxWidth: maxW });
            y -= 20;
          }
        }
        doc.setTitle(title);
        doc.setSubject('Created with Folio');
        const pdfBytes = await doc.save();
        const name = title.toLowerCase().replace(/\s+/g, '_') + '.pdf';
        downloadPDF(pdfBytes, name);
        showStatus('html-status', 'success', t('ap.html.ok') + downloadLink(objectUrl(pdfBytes), name));
      } catch (e) {
        await failOrCancel('html-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }

  // --- SANITISE PDF ---
  function initSanitize() {
    let file = null;
    const btn = document.getElementById('san-btn');
    setupUpload({
      inputId: 'san-input', listId: 'file-list-san-input', zoneId: 'upload-san-input',
      onFiles: (f) => { file = f[0]; document.getElementById('san-controls').style.display = ''; btn.disabled = false; },
    });
    async function run() {
      if (!file) { showStatus('san-status', 'error', t('ap.err.noFile')); return; }
      clearStatus('san-status');
      const current = document.getElementById('san-btn');
      setBusy(current, t('ap.san.busy'));
      const task = createRun('san-status', t('ap.san.busy'), { determinate: true });
      try {
        const wantMeta = document.getElementById('san-meta').checked;
        const wantJs = document.getElementById('san-js').checked;
        const wantAttachments = document.getElementById('san-attachments').checked;
        const doc = await PDFDocument.load(await readFileAsBytes(file));
        const catalog = doc.catalog;
        let removed = 0;

        if (wantMeta) {
          const info = typeof doc.getInfoDict === 'function' ? doc.getInfoDict() : undefined;
          if (info) {
            info.keys().forEach((key) => { info.delete(key); removed++; });
          }
          if (catalog.has(PDFName.of('Metadata'))) { catalog.delete(PDFName.of('Metadata')); removed++; }
        }
        if (wantJs) {
          if (catalog.has(PDFName.of('OpenAction'))) { catalog.delete(PDFName.of('OpenAction')); removed++; }
          if (catalog.has(PDFName.of('AA'))) { catalog.delete(PDFName.of('AA')); removed++; }
          const acro = catalog.lookupMaybe(PDFName.of('AcroForm'), PDFDict);
          if (acro && acro.has(PDFName.of('AA'))) { acro.delete(PDFName.of('AA')); removed++; }
          doc.getPages().forEach((page) => {
            if (page.node.has(PDFName.of('AA'))) { page.node.delete(PDFName.of('AA')); removed++; }
          });
        }
        const names = catalog.lookupMaybe(PDFName.of('Names'), PDFDict);
        if (names) {
          if (wantJs && names.has(PDFName.of('JavaScript'))) { names.delete(PDFName.of('JavaScript')); removed++; }
          if (wantAttachments && names.has(PDFName.of('EmbeddedFiles'))) { names.delete(PDFName.of('EmbeddedFiles')); removed++; }
          if (names.keys().length === 0) catalog.delete(PDFName.of('Names'));
        }

        const pdfBytes = await doc.save();
        const name = getFileName(file) + '_sanitised.pdf';
        downloadPDF(pdfBytes, name);
        task.set(100, '');
        showStatus('san-status', 'success',
          (removed ? t('ap.san.ok', { n: removed }) : t('ap.san.nothing')) + downloadLink(objectUrl(pdfBytes), name));
      } catch (e) {
        await failOrCancel('san-status', task, e, run);
      } finally {
        task.finish();
        setIdle(current);
      }
    }
    btn.addEventListener('click', run);
  }
