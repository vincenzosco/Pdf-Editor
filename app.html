<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio — PDF Editor</title>
  <meta name="description" content="Folio è un editor PDF gratuito che funziona nel browser: unisci, dividi, ruota, ritaglia, proteggi e firma i tuoi PDF. Niente da installare: tutto resta sul tuo dispositivo." />
  <meta name="theme-color" content="#1F4C82" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Folio" />
  <meta property="og:locale" content="it_IT" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:title" content="Folio — PDF Editor" />
  <meta property="og:description" content="Strumenti PDF gratuiti direttamente nel browser: unisci, dividi, ruota, ritaglia, proteggi e firma i tuoi documenti. Nessuna installazione, nessun upload." />
  <!-- Update og:url / og:image below if the site is hosted at a different address -->
  <meta property="og:url" content="https://vincenzosco.github.io/Pdf-Editor/app.html" />
  <meta property="og:image" content="https://vincenzosco.github.io/Pdf-Editor/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="vendor/pdf-lib.min.js"></script>
  <style>
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F4F3EF;
      --surface: #FFFFFF;
      --sidebar-bg: #EDEBE6;
      --text-primary: #1B1C20;
      --text-secondary: #787C82;
      --accent-red: #D13433;
      --accent-red-light: rgba(209, 52, 51, 0.08);
      --ink-blue: #1F4C82;
      --ink-blue-light: rgba(31, 76, 130, 0.06);
      --amber: #B45309;
      --border: #E7E4DE;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --sidebar-w: 280px;
      --topbar-h: 60px;
      --grad-ink: linear-gradient(135deg, #1F4C82 0%, #2F6FB3 100%);
      --grad-ink-deep: linear-gradient(135deg, #16324F 0%, #1F4C82 100%);
      --ring: 0 0 0 4px rgba(31, 76, 130, 0.14);
      --shadow-lift: 0 14px 34px -14px rgba(27, 28, 32, 0.18), 0 2px 8px rgba(27, 28, 32, 0.05);
      --radius-lg: 16px;
    }
    /* UI styling adapted from open-source components on https://uiverse.io (MIT) */

    html, body { height: 100%; font-family: var(--body); background: var(--bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; }

    /* ===== TOP BAR ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--topbar-h); background: rgba(247, 246, 242, 0.85);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
    }
    .topbar::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(209, 52, 51, 0.45), rgba(31, 76, 130, 0.4), transparent);
      pointer-events: none;
    }
    .topbar .logo {
      display: flex; align-items: center; gap: 8px; text-decoration: none;
      color: var(--text-primary); font-family: var(--display); font-size: 1.1rem;
      font-weight: 700; font-variation-settings: 'opsz' 144; letter-spacing: -0.02em;
    }
    .topbar .logo-mark {
      width: 10px; height: 10px; background: var(--accent-red); border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, #E4574F, var(--accent-red) 55%, #8F1D1C);
      box-shadow: 0 0 0 3px rgba(209, 52, 51, 0.12);
    }
    .topbar .topbar-title {
      font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;
      border-left: 1px solid var(--border); padding-left: 16px;
    }

    /* Language switch — segmented pill */
    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
    }
    .lang-btn {
      border: none; background: transparent; cursor: pointer;
      padding: 5px 12px; border-radius: 999px;
      font-family: var(--body); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.04em; color: var(--text-secondary);
      transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .lang-btn:hover { color: var(--text-primary); }
    .lang-btn.active {
      background: var(--grad-ink); color: #fff;
      box-shadow: 0 2px 6px -2px rgba(31, 76, 130, 0.5);
    }
    .lang-btn:focus-visible {
      outline: 2px solid var(--ink-blue); outline-offset: 1px;
    }
    .topbar-spacer { height: var(--topbar-h); }

    /* ===== LAYOUT ===== */
    .app-layout { display: flex; min-height: calc(100vh - var(--topbar-h)); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, #F0EEE9 0%, var(--sidebar-bg) 30%);
      border-right: 1px solid var(--border); overflow-y: auto;
      position: fixed; top: var(--topbar-h); bottom: 0;
      padding: 16px 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar-category { margin-bottom: 4px; }
    .sidebar-category-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 20px; font-size: 0.65rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary);
      cursor: pointer; user-select: none; transition: color 0.15s;
    }
    .sidebar-category-header:hover { color: var(--text-primary); }
    .sidebar-category-header .arrow {
      font-size: 0.5rem; transition: transform 0.2s;
    }
    .sidebar-category-header.collapsed .arrow { transform: rotate(-90deg); }
    .sidebar-category-items { padding: 0; }
    .sidebar-category-items.collapsed { display: none; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 20px 7px 28px; font-size: 0.8125rem; color: var(--text-secondary);
      cursor: pointer; transition: background 0.15s, color 0.15s; border: none;
      background: none; width: 100%; text-align: left; font-family: var(--body);
      border-radius: 0;
    }
    .sidebar-item:hover { background: rgba(31,76,130,0.07); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--surface); color: var(--text-primary); font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent-red), 0 2px 10px rgba(27,28,32,0.05);
      border-radius: 8px 0 0 8px;
    }
    .sidebar-item .icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .sidebar-item:hover .icon, .sidebar-item.active .icon { opacity: 1; }

    /* ===== MAIN ===== */
    .main {
      margin-left: var(--sidebar-w); flex: 1; padding: 36px 44px 72px;
      min-height: calc(100vh - var(--topbar-h));
      background:
        radial-gradient(1100px 480px at 88% -12%, rgba(31,76,130,0.05), transparent 60%),
        radial-gradient(900px 420px at -8% 110%, rgba(209,52,51,0.045), transparent 60%);
    }
    .tool-section { display: none; }
    .tool-section.active { display: block; }
    .tool-section h2 {
      font-family: var(--display); font-size: 1.5rem; font-weight: 700;
      font-variation-settings: 'opsz' 144; line-height: 1.2; margin-bottom: 6px;
    }
    .tool-section .tool-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.6; }
    .tool-section .tool-desc a { color: var(--ink-blue); }

    /* ===== UPLOAD ZONE ===== */
    .upload-zone {
      position: relative; overflow: hidden;
      border: 2px dashed #CFC9BE; border-radius: var(--radius-lg); padding: 56px 28px;
      text-align: center; cursor: pointer;
      background:
        radial-gradient(420px 200px at 50% -5%, rgba(31,76,130,0.07), transparent 70%),
        linear-gradient(180deg, #FDFCFA, var(--surface));
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .upload-zone::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(320px 170px at 50% 0%, rgba(31,76,130,0.13), transparent 75%);
      transition: opacity 0.25s ease;
    }
    .upload-zone:hover::before,
    .upload-zone.drag-over::before { opacity: 1; }
    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--ink-blue);
      box-shadow: 0 12px 30px -18px rgba(31,76,130,0.5);
      transform: translateY(-2px);
    }
    .upload-zone.drag-over { background: var(--ink-blue-light); }
    .upload-zone .upload-icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; line-height: 1; border-radius: 50%;
      background: linear-gradient(135deg, var(--ink-blue-light), rgba(209,52,51,0.1));
      box-shadow: 0 8px 20px -10px rgba(31,76,130,0.45), inset 0 0 0 1px rgba(31,76,130,0.1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .upload-zone:hover .upload-icon { transform: translateY(-4px) scale(1.06); }
    .upload-zone.drag-over .upload-icon { animation: uiverse-bob 0.6s ease-in-out infinite alternate; }
    @keyframes uiverse-bob { from { transform: translateY(-2px); } to { transform: translateY(4px); } }
    .upload-zone p { font-size: 0.95rem; color: var(--text-secondary); }
    .upload-zone .upload-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 18px; padding: 10px 26px;
      background: var(--grad-ink); color: #fff; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none;
      font-family: var(--body);
      box-shadow: 0 8px 18px -8px rgba(31,76,130,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .upload-zone .upload-btn:hover {
      filter: brightness(1.07); transform: translateY(-1px);
      box-shadow: 0 12px 24px -10px rgba(31,76,130,0.7), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone.multi { padding: 40px 28px; }

    /* ===== FILE LIST ===== */
    .file-list { margin-top: 16px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px 10px 10px; margin-bottom: 8px; gap: 12px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .file-item:hover { border-color: #D5D0C4; box-shadow: var(--shadow-sm); }
    .file-item .file-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .file-item .file-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--ink-blue-light); border-radius: 10px; font-size: 1rem;
    }
    .file-item .file-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .file-size {
      font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
      background: rgba(27,28,32,0.05); padding: 3px 9px; border-radius: 999px; flex-shrink: 0;
    }
    .file-item .file-remove {
      background: none; border: none; cursor: pointer; color: var(--text-secondary);
      font-size: 1.1rem; padding: 2px 8px; border-radius: 8px; line-height: 1.4;
      transition: color 0.15s, background 0.15s, transform 0.15s;
    }
    .file-item .file-remove:hover {
      color: var(--accent-red); background: var(--accent-red-light); transform: scale(1.08);
    }

    /* ===== CONTROLS ===== */
    .tool-controls {
      margin-top: 20px; padding: 22px 22px 20px;
      background: linear-gradient(180deg, #FDFCFA, var(--surface));
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .tool-controls label {
      display: block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; margin-bottom: 7px; color: #5B5F66;
    }
    .tool-controls .control-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
    .tool-controls .control-row:last-child { margin-bottom: 2px; }
    .tool-controls .control-group { display: flex; flex-direction: column; gap: 4px; }
    .tool-controls select,
    .tool-controls input[type="text"],
    .tool-controls input[type="number"],
    .tool-controls input[type="password"],
    .tool-controls textarea {
      padding: 9px 12px; border: 1px solid #D8D3C9; border-radius: 10px;
      font-family: var(--body); font-size: 0.875rem; background: #fff;
      color: var(--text-primary); min-width: 120px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .tool-controls textarea { resize: vertical; }
    .tool-controls .tool-textarea {
      width: 100%; min-height: 170px; font-family: var(--mono); font-size: 0.8rem; line-height: 1.6;
    }
    .tool-controls select:focus,
    .tool-controls input:focus,
    .tool-controls textarea:focus {
      outline: none; border-color: var(--ink-blue); box-shadow: var(--ring);
    }
    .tool-controls .color-picker-wrap { display: flex; align-items: center; gap: 8px; }
    .tool-controls input[type="color"] {
      width: 38px; height: 38px; border: 1px solid #D8D3C9; border-radius: 50%;
      cursor: pointer; padding: 3px; background: #fff;
      transition: transform 0.15s ease, box-shadow 0.18s ease;
    }
    .tool-controls input[type="color"]:hover { transform: scale(1.06); box-shadow: var(--ring); }
    .tool-controls input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    .tool-controls input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }

    /* ===== ACTIONS ===== */
    .tool-actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-primary {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 28px; background: var(--grad-ink); color: #fff; border: none; border-radius: 999px;
      font-family: var(--body); font-size: 0.9rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 22px -10px rgba(31,76,130,0.65), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    /* uiverse-style shine sweep on hover */
    .btn-primary::after {
      content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.5), transparent);
      transform: skewX(-20deg); opacity: 0;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.06); transform: translateY(-2px);
      box-shadow: 0 16px 30px -12px rgba(31,76,130,0.75);
    }
    .btn-primary:hover:not(:disabled)::after { opacity: 1; animation: uiverse-sweep 0.9s ease; }
    .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    @keyframes uiverse-sweep { to { left: 120%; } }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 26px; background: transparent; color: var(--ink-blue);
      border: 1px solid #CFC9BE; border-radius: 999px; font-family: var(--body);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }
    .btn-secondary:hover {
      border-color: var(--ink-blue); background: var(--ink-blue-light);
      color: var(--ink-blue); transform: translateY(-1px);
    }

    /* ===== PREVIEW / STATUS ===== */
    .tool-status {
      margin-top: 18px; padding: 14px 18px 14px 20px; border-radius: 12px;
      font-size: 0.85rem; display: none; line-height: 1.6; position: relative;
    }
    .tool-status.success { display: block; background: #F3FAF6; border: 1px solid #C4E4D2; color: #1D6B45; }
    .tool-status.error { display: block; background: #FDF4F3; border: 1px solid #F2CCC9; color: var(--accent-red); }
    .tool-status.info { display: block; background: #F1F6FB; border: 1px solid #CBD9EA; color: #1D4E82; }
    .tool-status.success::before,
    .tool-status.error::before,
    .tool-status.info::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px;
    }
    .tool-status.success::before { background: #2F9E63; }
    .tool-status.error::before { background: var(--accent-red); }
    .tool-status.info::before { background: var(--ink-blue); }
    .tool-status .download-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; padding: 9px 20px; background: var(--grad-ink); color: #fff;
      border-radius: 999px; text-decoration: none; font-size: 0.85rem; font-weight: 600;
      box-shadow: 0 6px 14px -8px rgba(31,76,130,0.6);
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .tool-status .download-link:hover { filter: brightness(1.07); transform: translateY(-1px); }

    /* ===== PLACEHOLDER ===== */
    .placeholder-card {
      background: linear-gradient(180deg, #FDFCFA, var(--surface));
      border: 1px dashed #CFC9BE; border-radius: var(--radius-lg);
      padding: 44px 28px; text-align: center; margin-top: 20px;
    }
    .placeholder-card .pl-icon {
      width: 60px; height: 60px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; border-radius: 50%; background: rgba(180, 83, 9, 0.09);
    }
    .placeholder-card h3 { font-family: var(--display); font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
    .placeholder-card p { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; max-width: 480px; margin: 0 auto; }
    .placeholder-card code {
      font-family: var(--mono); font-size: 0.8em; background: rgba(27,28,32,0.06);
      padding: 1px 6px; border-radius: 5px;
    }

    /* ===== PAGE LIST (reorder) ===== */
    .page-list { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
    .page-item {
      background: var(--surface); border: 1px solid #D8D3C9; border-radius: 10px;
      padding: 8px 12px; font-size: 0.8rem; cursor: grab; user-select: none;
      display: flex; align-items: center; gap: 4px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .page-item:hover { border-color: var(--ink-blue); transform: translateY(-1px); }
    .page-item.dragging { opacity: 0.4; }
    .page-item .page-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 0.9rem; padding: 2px 5px;
      border-radius: 6px; transition: color 0.15s, background 0.15s; font-family: var(--body);
    }
    .page-item .page-btn:hover { color: var(--ink-blue); background: var(--ink-blue-light); }
    .page-item .page-num { font-weight: 600; }
    .page-item .page-del {
      background: none; border: none; cursor: pointer; color: var(--text-secondary);
      font-size: 0.9rem; padding: 2px 5px; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    .page-item .page-del:hover { color: var(--accent-red); background: var(--accent-red-light); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: relative; top: 0; height: auto; max-height: 40vh; }
      .main { margin-left: 0; padding: 24px 18px 60px; }
      .app-layout { flex-direction: column; }
    }

    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast notifications */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 12px; font-size: 0.85rem; font-weight: 500;
      z-index: 999; box-shadow: var(--shadow-lift);
      animation: toastIn 0.3s ease-out;
    }
    .toast.info { background: var(--text-primary); color: #fff; }
    .toast.error { background: var(--accent-red); color: #fff; }
    .toast.success { background: #1F7A4C; color: #fff; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body data-title-key="ap.page.title">

  function buildSidebar() {
    let html = '';
    CATEGORIES().forEach((cat, ci) => {
      html += `<div class="sidebar-category">
        <div class="sidebar-category-header ${ci > 0 ? 'collapsed' : ''}" data-cat="${ci}">
          <span>${cat.icon} ${cat.name}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="sidebar-category-items ${ci > 0 ? 'collapsed' : ''}">`;
      cat.tools.forEach(tool => {
        html += `<button class="sidebar-item" data-tool="${tool.id}">
          <span class="icon">${tool.icon}</span> ${tool.label}
        </button>`;
      });
      html += `</div></div>`;
    });
    sidebar.innerHTML = html;

    // Category toggle
    sidebar.querySelectorAll('.sidebar-category-header').forEach(hdr => {
      hdr.addEventListener('click', () => {
        hdr.classList.toggle('collapsed');
        const items = hdr.nextElementSibling;
        items.classList.toggle('collapsed');
      });
    });

    // Tool selection
    sidebar.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', () => {
        sidebar.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        showTool(item.dataset.tool);
      });
    });
  }

    switch (tool.id) {

    return `<div class="upload-zone ${multi ? 'multi' : ''}" id="upload-${id}" data-multi="${multi}">

      <div class="file-list" id="file-list-${id}"></div>
    </div>`;
  }

  function setupUpload(cfg) {
    const { inputId, listId, zoneId, onFiles } = cfg;
    const input = document.getElementById(inputId);
    const zone = document.getElementById(zoneId);
    const list = document.getElementById(listId);

    // Currently selected files. Kept in sync with the list so that removing
    // a row also removes the file from the operation, not just from the DOM.
    let selected = [];

    function renderList() {
      list.innerHTML = '';
      selected.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<div class="file-info"><span class="file-icon">📄</span>
          <span class="file-name">${file.name}</span>
          <span class="file-size">${(file.size / 1024).toFixed(1)} KB</span></div>
          <button class="file-remove" data-index="${index}">✕</button>`;
        list.appendChild(div);
      });
      // Remove handler
      list.querySelectorAll('.file-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          selected.splice(parseInt(btn.getAttribute('data-index'), 10), 1);
          if (onFiles) onFiles(selected);
          renderList();
        });
      });
    }

    function handleFiles(files) {
      selected = Array.from(files);
      if (onFiles) onFiles(selected);
      renderList();
    }

    input.addEventListener('change', () => handleFiles(Array.from(input.files)));
    zone.addEventListener('click', (e) => { if (!e.target.closest('.file-remove')) input.click(); });
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault(); zone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
    });
  }

  function showStatus(id, type, msg, extra = '') {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = `tool-status ${type}`;
    el.innerHTML = msg + extra;
    el.style.display = 'block';
  }

  function clearStatus(id) {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  }

  function getFileName(file) {
    return file.name.replace(/\.[^/.]+$/, '');
  }

  async function readFileAsBytes(file) {
    return new Uint8Array(await file.arrayBuffer());

  // ===== TOOL IMPLEMENTATIONS =====
  let currentPdfBytes = null;
  let currentFileName = '';

  function parsePageRange(input, totalPages) {
    const pages = new Set();
    const parts = input.split(',').map(s => s.trim());
    for (const part of parts) {
      if (part.includes('-')) {
        const [a, b] = part.split('-').map(s => parseInt(s.trim()));
        if (!isNaN(a) && !isNaN(b)) {
          for (let i = a; i <= b; i++) pages.add(i);
        }
      } else {
        const n = parseInt(part);
        if (!isNaN(n)) pages.add(n);
      }
    }
    return Array.from(pages).filter(n => n >= 1 && n <= totalPages);
  }

  function downloadPDF(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    // Append to the document (required by Firefox) and revoke only after the
    // download has had time to start, otherwise the click is silently dropped.
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Build the object URL for the "Download" links shown in status messages
  // and revoke it later, so repeated operations do not leak blob memory.
  function objectUrl(bytes) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return url;
  }

  function initSplit() {
    let file = null;
    setupUpload({
      inputId: 'split-input', listId: 'file-list-split-input', zoneId: 'upload-split-input',
      onFiles: (f) => { file = f[0]; document.getElementById('split-btn').disabled = false; document.getElementById('split-controls').style.display = ''; }
    });

    document.getElementById('split-mode').addEventListener('change', () => {
      const mode = document.getElementById('split-mode').value;
      document.getElementById('split-range-group').style.display = mode === 'range' ? '' : 'none';
      document.getElementById('split-every-group').style.display = mode === 'every' ? '' : 'none';
    });

    document.getElementById('split-btn').addEventListener('click', async () => {
      if (!file) return showStatus('split-status', 'error', FolioI18N.t('ap.err.noFile'));
      clearStatus('split-status');
      const btn = document.getElementById('split-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.split.busy');
      try {
        const bytes = await readFileAsBytes(file);
        const srcDoc = await PDFDocument.load(bytes);
        const total = srcDoc.getPageCount();
        const mode = document.getElementById('split-mode').value;
        const parts = [];

        if (mode === 'range') {
          const range = document.getElementById('split-range').value;
          if (!range) { btn.disabled = false; btn.innerHTML = '<span>⊟</span> ' + FolioI18N.t('ap.split.btn'); return showStatus('split-status', 'error', FolioI18N.t('ap.split.errRange')); }
          const pages = parsePageRange(range, total);
          if (pages.length === 0) throw new Error(FolioI18N.t('ap.split.errNoPages', { n: total }));
          const partDoc = await PDFDocument.create();
          const pageRefs = await partDoc.copyPages(srcDoc, pages.map(p => p - 1));
          pageRefs.forEach(p => partDoc.addPage(p));
          parts.push({ doc: partDoc, name: `${getFileName(file)}_pages_${pages[0]}-${pages[pages.length-1]}.pdf` });
        } else {
          const every = parseInt(document.getElementById('split-every').value) || 2;
          for (let start = 0; start < total; start += every) {
            const end = Math.min(start + every, total);
            const partDoc = await PDFDocument.create();
            const pages = [];
            for (let i = start; i < end; i++) pages.push(i);
            const pageRefs = await partDoc.copyPages(srcDoc, pages);
            pageRefs.forEach(p => partDoc.addPage(p));
            parts.push({ doc: partDoc, name: `${getFileName(file)}_part_${Math.floor(start/every)+1}.pdf` });
          }
        }

        for (const part of parts) {
          const pdfBytes = await part.doc.save();
          downloadPDF(pdfBytes, part.name);
        }
        showStatus('split-status', 'success', FolioI18N.t('ap.split.ok', { n: parts.length }));
      } catch (e) {
        showStatus('split-status', 'error', FolioI18N.t('ap.err.run') + e.message);
      }
      btn.disabled = false; btn.innerHTML = '<span>⊟</span> ' + FolioI18N.t('ap.split.btn');
    });
  }

        div.className = 'page-item';

        }
        if (pos < pageOrder.length - 1) {
          const down = document.createElement('button');
          down.textContent = '↓'; down.className = 'page-btn'; down.title = FolioI18N.t('ap.reorder.down');
          down.addEventListener('click', () => { [pageOrder[pos+1], pageOrder[pos]] = [pageOrder[pos], pageOrder[pos+1]]; renderReorderList(); });

      inputId: 'page-input', listId: 'file-list-page-input', zoneId: 'upload-page-input',
      onFiles: (f) => { file = f[0]; document.getElementById('page-btn').disabled = false; document.getElementById('page-controls').style.display = ''; }

      const btn = document.getElementById('page-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.pagenum.busy');
      try {
        const pos = document.getElementById('page-pos').value;
        const start = parseInt(document.getElementById('page-start').value) || 1;
        const format = document.getElementById('page-format').value;
        const bytes = await readFileAsBytes(file);
        const doc = await PDFDocument.load(bytes);
        const pages = doc.getPages();
        const font = await doc.embedFont(StandardFonts.Helvetica);

        pages.forEach((page, i) => {
          const { width, height } = page.getSize();
          let num = (start + i).toString();
          if (format === '01') num = String(num).padStart(2, '0');
          else if (format === '001') num = String(num).padStart(3, '0');
          else if (format === '-1-') num = `-${num}-`;

          let x, y;
          const margin = 40;
          switch (pos) {
            case 'bottom-center': x = width / 2 - 10; y = margin; break;
            case 'bottom-right': x = width - margin; y = margin; break;
            case 'bottom-left': x = margin; y = margin; break;
            case 'top-center': x = width / 2 - 10; y = height - margin; break;
            case 'top-right': x = width - margin; y = height - margin; break;
            case 'top-left': x = margin; y = height - margin; break;
          }
          page.drawText(num, { x, y, font, size: 10, color: rgb(0.2, 0.2, 0.2) });
        });
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, `${getFileName(file)}_with-page-numbers.pdf`);
        showStatus('page-status', 'success', `${FolioI18N.t('ap.pagenum.ok')}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="${getFileName(file)}_with-page-numbers.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('page-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>#</span> ' + FolioI18N.t('ap.pagenum.btn');

      try {
        const text = document.getElementById('wm-text').value || 'BOZZA';

        const colorHex = document.getElementById('wm-color').value;

        const r = parseInt(colorHex.slice(1,3),16)/255;
        const g = parseInt(colorHex.slice(3,5),16)/255;

        const bytes = await readFileAsBytes(file);

            x: centerX - textWidth / 2,
            y: centerY - size / 3,
            font, size, color: rgb(r, g, b), opacity,
            rotate: degrees(rotation),
          });
        });
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, `${getFileName(file)}_watermarked.pdf`);
        showStatus('wm-status', 'success', `${FolioI18N.t('ap.wm.ok')}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="${getFileName(file)}_watermarked.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('wm-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>💧</span> ' + FolioI18N.t('ap.wm.btn');
    });
  }    // --- CROP ---
  function initCrop() {
    let file = null;
    setupUpload({
      inputId: 'crop-input', listId: 'file-list-crop-input', zoneId: 'upload-crop-input',
      onFiles: (f) => { file = f[0]; document.getElementById('crop-btn').disabled = false; document.getElementById('crop-controls').style.display = ''; }
    });
    document.getElementById('crop-btn').addEventListener('click', async () => {
      if (!file) return showStatus('crop-status', 'error', FolioI18N.t('ap.err.noFile'));
      clearStatus('crop-status');
      const btn = document.getElementById('crop-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.crop.busy');
      try {
        const left = parseInt(document.getElementById('crop-left').value) || 0;
        const right = parseInt(document.getElementById('crop-right').value) || 0;
        const top = parseInt(document.getElementById('crop-top').value) || 0;
        const bottom = parseInt(document.getElementById('crop-bottom').value) || 0;
        // Convert mm to points (1mm = 2.83465pt)
        const mm2pt = 2.83465;
        const l = left * mm2pt, r = right * mm2pt, t = top * mm2pt, b = bottom * mm2pt;

        const bytes = await readFileAsBytes(file);
        const doc = await PDFDocument.load(bytes);
        const pages = doc.getPages();
        pages.forEach(page => {
          const { width, height } = page.getSize();
          page.setMediaBox(l, b, width - l - r, height - t - b);
        });
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, `${getFileName(file)}_cropped.pdf`);
        showStatus('crop-status', 'success', `${FolioI18N.t('ap.crop.ok')}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="${getFileName(file)}_cropped.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('crop-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>✂</span> ' + FolioI18N.t('ap.crop.btn');
    });
  }    // --- EDIT TEXT ---
  function initEditText() {
    let file = null;
    setupUpload({
      inputId: 'edit-input', listId: 'file-list-edit-input', zoneId: 'upload-edit-input',
      onFiles: (f) => { file = f[0]; document.getElementById('edit-btn').disabled = false; document.getElementById('edit-controls').style.display = ''; }
    });
    document.getElementById('edit-btn').addEventListener('click', async () => {
      if (!file) return showStatus('edit-status', 'error', FolioI18N.t('ap.err.noFile'));
      const text = document.getElementById('edit-text').value;
      if (!text) return showStatus('edit-status', 'error', FolioI18N.t('ap.edittext.errText'));
      clearStatus('edit-status');
      const btn = document.getElementById('edit-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.edittext.busy');
      try {
        const x = parseInt(document.getElementById('edit-x').value) || 50;
        const y = parseInt(document.getElementById('edit-y').value) || 50;
        const size = parseInt(document.getElementById('edit-size').value) || 12;
        const colorHex = document.getElementById('edit-color').value;
        const r = parseInt(colorHex.slice(1,3),16)/255;
        const g = parseInt(colorHex.slice(3,5),16)/255;
        const b = parseInt(colorHex.slice(5,7),16)/255;

        const bytes = await readFileAsBytes(file);
        const doc = await PDFDocument.load(bytes);
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const pages = doc.getPages();

        pages.forEach(page => {
          const { height } = page.getSize();
          const adjustedY = height - y;
          page.drawText(text, { x, y: adjustedY, font, size, color: rgb(r,g,b) });
        });
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, `${getFileName(file)}_with-text.pdf`);
        showStatus('edit-status', 'success', `${FolioI18N.t('ap.edittext.ok', { n: pages.length })}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="${getFileName(file)}_with-text.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('edit-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>✎</span> ' + FolioI18N.t('ap.edittext.btn');
    });
  }    // --- JPG TO PDF ---
  function initJpgToPdf() {
    let files = [];
    setupUpload({
      inputId: 'jpg-input', listId: 'file-list-jpg-input', zoneId: 'upload-jpg-input',
      onFiles: (f) => { files = f; document.getElementById('jpg-btn').disabled = files.length === 0; document.getElementById('jpg-controls').style.display = ''; }
    });
    document.getElementById('jpg-btn').addEventListener('click', async () => {
      if (files.length === 0) return showStatus('jpg-status', 'error', FolioI18N.t('ap.jpg.errNone'));
      clearStatus('jpg-status');
      const btn = document.getElementById('jpg-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.jpg.busy');
      try {
        const orientation = document.getElementById('jpg-orientation').value;
        const format = document.getElementById('jpg-format').value;
        const sizes = { A4: [595.28, 841.89], LETTER: [612, 792], A3: [841.89, 1190.55] };
        let [pw, ph] = sizes[format] || sizes.A4;
        if (orientation === 'landscape') [pw, ph] = [ph, pw];

        const doc = await PDFDocument.create();
        for (const file of files) {
          const imgBytes = await readFileAsBytes(file);
          let img;
      if (file.type === 'image/png' || file.name.match(/\.png$/i)) img = await doc.embedPng(imgBytes);
      else if (file.type === 'image/webp' || file.name.match(/\.webp$/i)) {
        btn.disabled = false; btn.innerHTML = '<span>🖼</span> ' + FolioI18N.t('ap.jpg.btn');
        showStatus('jpg-status', 'error', FolioI18N.t('ap.jpg.errWebp'));
        return;
      }
      else img = await doc.embedJpg(imgBytes);

          const scale = Math.min(pw / img.width, ph / img.height);
          const dw = img.width * scale, dh = img.height * scale;
          const dx = (pw - dw) / 2, dy = (ph - dh) / 2;

          const page = doc.addPage([pw, ph]);
          page.drawImage(img, { x: dx, y: dy, width: dw, height: dh });
        }
        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, 'images.pdf');
        showStatus('jpg-status', 'success', `${FolioI18N.t('ap.jpg.ok', { n: files.length })}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="images.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('jpg-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>🖼</span> ' + FolioI18N.t('ap.jpg.btn');
    });
  }

  // --- HTML TO PDF ---
  function initHtmlToPdf() {
    document.getElementById('html-btn').addEventListener('click', async () => {
      const html = document.getElementById('html-input').value;
      if (!html) return showStatus('html-status', 'error', FolioI18N.t('ap.html.errEmpty'));
      clearStatus('html-status');
      const btn = document.getElementById('html-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + FolioI18N.t('ap.html.busy');
      try {
        const title = document.getElementById('html-title').value || FolioI18N.t('ap.html.titleDefault');
        const doc = await PDFDocument.create();
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const fontBold = await doc.embedFont(StandardFonts.HelveticaBold);
        const pageSize = [595.28, 841.89];
        let page = doc.addPage(pageSize);
        const { width, height } = page.getSize();

        // Simple markdown-to-PDF conversion
        const lines = html.split('\n');
        let y = height - 60;
        const margin = 50;
        const maxW = width - margin * 2;

        for (const line of lines) {
          if (y < 60) { page = doc.addPage(pageSize); y = height - 60; }
          const trimmed = line.trim();
          if (!trimmed) { y -= 16; continue; }

          if (trimmed.startsWith('# ')) {
            page.drawText(trimmed.slice(2), { x: margin, y, font: fontBold, size: 22, color: rgb(0.1,0.1,0.1) });
            y -= 32;
          } else if (trimmed.startsWith('## ')) {
            page.drawText(trimmed.slice(3), { x: margin, y, font: fontBold, size: 16, color: rgb(0.15,0.15,0.15) });
            y -= 28;
          } else if (trimmed.startsWith('- ')) {
            page.drawText(`•  ${trimmed.slice(2)}`, { x: margin + 12, y, font, size: 10, color: rgb(0.2,0.2,0.2) });
            y -= 22;
          } else {
            page.drawText(trimmed, { x: margin, y, font, size: 10, color: rgb(0.2,0.2,0.2), maxWidth: maxW });
            y -= 20;
          }
        }

        // Title in PDF metadata
        doc.setTitle(title);
        doc.setSubject('Created with Folio');

        const pdfBytes = await doc.save();
        downloadPDF(pdfBytes, `${title.toLowerCase().replace(/\s+/g,'_')}.pdf`);
        showStatus('html-status', 'success', `${FolioI18N.t('ap.html.ok')}
          <br/><a class="download-link" href="${objectUrl(pdfBytes)}" download="${title.toLowerCase().replace(/\s+/g,'_')}.pdf">${FolioI18N.t('ap.download')}</a>`);
      } catch (e) { showStatus('html-status', 'error', FolioI18N.t('ap.err.run') + e.message); }
      btn.disabled = false; btn.innerHTML = '<span>🌐</span> ' + FolioI18N.t('ap.html.btn');
    });
  }

  // ===== NAVIGATION =====
  function showTool(id) {
    document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
    const section = document.getElementById(`tool-${id}`);
    if (section) section.classList.add('active');
  }

  // ===== INIT =====
  function init(preferredToolId) {
    buildSidebar();
    buildToolSections();

    // Select the requested tool, otherwise the first one
    const firstItem = preferredToolId
      ? document.querySelector('.sidebar-item[data-tool="' + preferredToolId + '"]')
      : document.querySelector('.sidebar-item');
    if (firstItem) { firstItem.classList.add('active'); showTool(firstItem.dataset.tool); }

    if (!hasPDFLib) {
      // Keep the layout visible and explain the problem instead of failing silently.
      const first = document.querySelector('.tool-section');
      if (first) {
        first.innerHTML = `<div class="placeholder-card">
          <h3>${FolioI18N.t('ap.fatal.title')}</h3>
          <p>${FolioI18N.t('ap.fatal.body')}</p>
        </div>`;
      }
      return;
    }

    // Init all working tools
    initMerge();
    initSplit();
    initRemovePages();
    initExtractPages();
    initReorder();
    initRotate();
    initPageNumbers();
    initWatermark();
    initCrop();
    initEditText();
    initJpgToPdf();
    initHtmlToPdf();
    FolioServerTools.initAll();
  }

  // === Language switch (EN / IT) ===
  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    const titleKey = document.body.getAttribute('data-title-key');
    if (titleKey) document.title = FolioI18N.t(titleKey);

    // Static chrome (topbar labels / aria)
    const txtEls = document.querySelectorAll('[data-i18n]');
    for (let i = 0; i < txtEls.length; i++) {
      txtEls[i].textContent = FolioI18N.t(txtEls[i].getAttribute('data-i18n'));
    }
    const ariaEls = document.querySelectorAll('[data-i18n-aria]');
    for (let a = 0; a < ariaEls.length; a++) {
      ariaEls[a].setAttribute('aria-label', FolioI18N.t(ariaEls[a].getAttribute('data-i18n-aria')));
    }

    const btns = document.querySelectorAll('.lang-btn');
    for (let b = 0; b < btns.length; b++) {
      const on = btns[b].getAttribute('data-lang') === lang;
      btns[b].classList.toggle('active', on);
      btns[b].setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    // Rebuild the JS-generated UI in the new language and keep the
    // currently selected tool open (a fresh page load picks the default).
    const activeItem = document.querySelector('.sidebar-item.active');
    const keep = activeItem ? activeItem.dataset.tool : null;
    init(keep);

    // Keep og / meta tags and the URL in sync with the chosen language
    const locale = lang === 'it' ? 'it_IT' : 'en_US';
    const setMeta = (sel, content) => {
      const el = document.querySelector(sel);
      if (el) el.setAttribute('content', content);
    };
    setMeta('meta[property="og:locale"]', locale);
    setMeta('meta[property="og:title"]', FolioI18N.t('ap.page.title'));
    setMeta('meta[property="og:description"]', FolioI18N.t('ap.meta.desc'));
    setMeta('meta[name="description"]', FolioI18N.t('ap.meta.desc'));
    FolioI18N.syncUrl(lang);
    const links = document.querySelectorAll('a[href]');
    for (let li = 0; li < links.length; li++) {
      let href = links[li].getAttribute('href');
      if (!href || href.charAt(0) === '#' || /^[a-z]+:/i.test(href)) continue;
      const hashIdx = href.indexOf('#');
      const hash = hashIdx >= 0 ? href.slice(hashIdx) : '';
      let path = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
      path = path.replace(/[?&]lang=(en|it)/, '');
      if (lang === 'it') {
        path += (path.indexOf('?') >= 0 ? '&' : '?') + 'lang=it';
      }
      links[li].setAttribute('href', path + hash);
    }
  }

  const langBtns = document.querySelectorAll('.lang-btn');
  for (let lb = 0; lb < langBtns.length; lb++) {
    langBtns[lb].addEventListener('click', function () {
      var lang = this.getAttribute('data-lang');
      FolioI18N.set(lang);
      applyLanguage(lang);
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    applyLanguage(FolioI18N.current());
  });
  </script>
