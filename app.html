  // ===== SIDEBAR: search, favourites, recents, categories =====
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const pinnedBox = document.getElementById('sidebar-pinned');
  const categoriesBox = document.getElementById('sidebar-categories');
  const emptyBox = document.getElementById('sidebar-empty');
  const searchInput = document.getElementById('tool-search');
  const searchClear = document.getElementById('tool-search-clear');
  const collapsedCats = {};
  let favourites = store.get(KEY_FAVS, []);
  let recents = store.get(KEY_RECENTS, []);
  let query = '';
  let activeToolId = 'merge';

  function matchesQuery(tool, q) {
    if (!q) return true;
    const dicts = [FolioI18N.dict('en'), FolioI18N.dict('it')];
    const hay = dicts.map((d) => (d['ap.t.' + tool.id + '.label'] || '') + ' ' + (d['ap.t.' + tool.id + '.desc'] || '')).join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  // "Closest three" for an empty result: longest common prefix of words, so
  // "singn" still suggests "Sign PDF" instead of an empty sidebar.
  function closestTools(q, limit) {
    const score = (tool) => {
      const label = tool.label.toLowerCase();
      let best = 0;
      for (let i = 0; i < q.length; i++) {
        for (let j = i + 1; j <= q.length; j++) {
          const chunk = q.slice(i, j);
          if (chunk.length > best && label.indexOf(chunk) >= 0) best = chunk.length;
        }
      }
      return best;
    };
    return ALL_TOOLS()
      .map((tool) => ({ tool: tool, s: score(tool) }))
      .filter((entry) => entry.s > 1)
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 3)
      .map((entry) => entry.tool);
  }

  function toggleFavourite(id) {
    const at = favourites.indexOf(id);
    if (at >= 0) favourites.splice(at, 1);
    else favourites.push(id);
    store.set(KEY_FAVS, favourites);
    renderSidebar();
  }

  function rememberRecent(id) {
    recents = [id].concat(recents.filter((x) => x !== id)).slice(0, 6);
    store.set(KEY_RECENTS, recents);
  }

  function itemHTML(tool, extraClass) {
    const isFav = favourites.indexOf(tool.id) >= 0;
    return '<div class="sidebar-row' + (extraClass ? ' ' + extraClass : '') + '">' +
      '<button class="sidebar-item" data-tool="' + tool.id + '">' +
        '<span class="icon" aria-hidden="true">' + icon(tool.icon, { size: 16 }) + '</span>' +
        '<span class="sidebar-item__label">' + tool.label + '</span>' +
      '</button>' +
      '<button class="sidebar-star" type="button" data-fav="' + tool.id + '" aria-pressed="' + isFav + '" ' +
        'aria-label="' + (isFav ? t('ap.fav.remove') : t('ap.fav.add')) + '">' +
        icon(isFav ? 'star-filled' : 'star', { size: 15 }) + '</button>' +
    '</div>';
  }

  function renderSidebar() {
    const q = query.trim().toLowerCase();
    let html = '';
    let pinned = '';

    if (!q) {
      const favTools = favourites.map(findTool).filter(Boolean);
      if (favTools.length) {
        pinned += '<div class="sidebar-group"><div class="sidebar-group__head">' + icon('star', { size: 13 }) +
          '<span>' + t('ap.group.favourites') + '</span></div>' + favTools.map((tool) => itemHTML(tool)).join('') + '</div>';
      }
      const recentTools = recents.map(findTool).filter(Boolean).filter((tool) => favourites.indexOf(tool.id) < 0);
      if (recentTools.length) {
        pinned += '<div class="sidebar-group"><div class="sidebar-group__head">' + icon('clock', { size: 13 }) +
          '<span>' + t('ap.group.recents') + '</span></div>' + recentTools.map((tool) => itemHTML(tool)).join('') + '</div>';
      }
    }
    pinnedBox.innerHTML = pinned;

    const cats = CATEGORIES();
    if (q) {
      const hits = ALL_TOOLS().filter((tool) => matchesQuery(tool, q));
      if (hits.length) {
        html = '<div class="sidebar-group"><div class="sidebar-group__head">' + icon('search', { size: 13 }) +
          '<span>' + t('ap.group.results', { n: hits.length }) + '</span></div>' +
          hits.map((tool) => itemHTML(tool)).join('') + '</div>';
      }
    } else {
      cats.forEach((cat) => {
        const collapsed = !!collapsedCats[cat.id];
        html += '<div class="sidebar-category">' +
          '<button type="button" class="sidebar-category-header' + (collapsed ? ' collapsed' : '') + '" data-cat="' + cat.id + '" aria-expanded="' + (!collapsed) + '">' +
            '<span class="cat-icon">' + icon(cat.icon, { size: 14 }) + '<span>' + cat.name + '</span></span>' +
            '<span class="arrow" aria-hidden="true">' + icon('chevron', { size: 14 }) + '</span>' +
          '</button>' +
          '<div class="sidebar-category-items' + (collapsed ? ' collapsed' : '') + '">' +
            cat.tools.map((tool) => itemHTML(tool)).join('') +
          '</div></div>';
      });
    }
    categoriesBox.innerHTML = html;

    const nothing = !!q && !ALL_TOOLS().some((tool) => matchesQuery(tool, q));
    emptyBox.hidden = !nothing;
    if (nothing) {
      const close = closestTools(q, 3);
      emptyBox.innerHTML = '<p>' + t('ap.search.none', { q: query.trim() }) + '</p>' +
        (close.length ? '<p class="closest-label">' + t('ap.search.closest') + '</p><div class="closest">' +
          close.map((tool) => '<button type="button" data-closest="' + tool.id + '">' + tool.label + '</button>').join('') + '</div>' : '');
    }

    categoriesBox.querySelectorAll('.sidebar-category-header').forEach((hdr) => {
      hdr.addEventListener('click', () => {
        const id = hdr.getAttribute('data-cat');
        collapsedCats[id] = !collapsedCats[id];
        renderSidebar();
      });
    });
    sidebar.querySelectorAll('.sidebar-item').forEach((item) => {
      item.addEventListener('click', () => selectTool(item.getAttribute('data-tool')));
    });
    sidebar.querySelectorAll('.sidebar-star').forEach((star) => {
      star.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavourite(star.getAttribute('data-fav'));
      });
    });
    sidebar.querySelectorAll('[data-closest]').forEach((btn) => {
      btn.addEventListener('click', () => selectTool(btn.getAttribute('data-closest')));
    });

    const active = sidebar.querySelector('.sidebar-item.active');
    if (active) active.setAttribute('aria-current', 'true');
  }

  function selectTool(id, opts) {
    const tool = findTool(id);
    if (!tool) return;
    const remember = !opts || opts.remember !== false;
    activeToolId = id;
    sidebar.querySelectorAll('.sidebar-item').forEach((item) => {
      const on = item.getAttribute('data-tool') === id;
      item.classList.toggle('active', on);
      if (on) item.setAttribute('aria-current', 'true');
      else item.removeAttribute('aria-current');
    });
    document.querySelectorAll('.tool-panel').forEach((panel) => panel.classList.remove('active'));
    const panel = document.getElementById('tool-' + id);
    if (panel) panel.classList.add('active');

    // The category of the active tool opens automatically.
    const cat = categoryOf(id);
    if (cat && collapsedCats[cat.id]) { collapsedCats[cat.id] = false; renderSidebar(); }

    if (remember) rememberRecent(id);
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) closeSidebar();
    if (FolioI18N.syncUrl) {
      try {
        const params = new URLSearchParams(window.location.search);
        params.set('tool', id);
        window.history.replaceState(window.history.state, '', window.location.pathname + '?' + params.toString());
      } catch (e) { /* ignore */ }
    }
    return true;
  }

  // ===== OFF-CANVAS SIDEBAR (under 900px) =====
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebarBackdrop = document.getElementById('sidebar-backdrop');

  function openSidebar() {
    sidebar.classList.add('open');
    sidebarToggle.setAttribute('aria-expanded', 'true');
    sidebarBackdrop.hidden = false;
    sidebarBackdrop.classList.add('open');
    if (searchInput) searchInput.focus();
  }
  function closeSidebar() {
    const wasOpen = sidebar.classList.contains('open');
    sidebar.classList.remove('open');
    sidebarToggle.setAttribute('aria-expanded', 'false');
    sidebarBackdrop.classList.remove('open');
    sidebarBackdrop.hidden = true;
    if (wasOpen) sidebarToggle.focus();
  }
  sidebarToggle.addEventListener('click', () => {
    if (sidebar.classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  sidebarBackdrop.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
  });

  // ===== SEARCH (debounced 120 ms) =====
  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    searchClear.hidden = searchInput.value === '';
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => {
      query = searchInput.value;
      renderSidebar();
    }, 120);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.hidden = true;
    query = '';
    renderSidebar();
    searchInput.focus();
  });

  // ===== NAVIGATION / INIT =====
  function toolFromUrl() {
    try { return new URLSearchParams(window.location.search).get('tool'); } catch (e) { return null; }
  }

  function init(preferredToolId) {
    favourites = favourites.filter((id) => !!findTool(id));
    recents = recents.filter((id) => !!findTool(id));
    buildMain();
    if (!hasPDFLib) {
      // Keep the layout visible and explain the problem instead of failing silently.
      const first = main.querySelector('.tool-panel');
      if (first) {
        first.innerHTML = '<div class="placeholder-card"><h3>' + t('ap.fatal.title') + '</h3><p>' + t('ap.fatal.body') + '</p></div>';
      }
      renderSidebar();
      return;
    }
    Object.keys(TOOL_INIT).forEach((id) => {
      if (document.getElementById('tool-' + id)) TOOL_INIT[id]();
    });
    FolioServerTools.initAll();

    const wanted = preferredToolId && findTool(preferredToolId) ? preferredToolId : 'merge';
    // The tool that opens by itself is not a user choice, so it does not go
    // into Recents; only deliberate selections do.
    selectTool(wanted, { remember: false });
    renderSidebar();
    sidebar.querySelectorAll('.sidebar-item').forEach((item) => {
      item.classList.toggle('active', item.getAttribute('data-tool') === activeToolId);
    });
  }

  // === Language switch (EN / IT) ===
  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    const titleKey = document.body.getAttribute('data-title-key');
    if (titleKey) document.title = FolioI18N.t(titleKey);

    // Static chrome (topbar labels / aria). Text-bearing nodes are replaced,
    // icons are painted separately so they survive a language change.
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = FolioI18N.t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', FolioI18N.t(el.getAttribute('data-i18n-aria'))); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.setAttribute('placeholder', FolioI18N.t(el.getAttribute('data-i18n-placeholder'))); });
    document.querySelectorAll('[data-icon]').forEach((el) => el.removeAttribute('data-icon-done'));
    if (window.folioPaintIcons) window.folioPaintIcons(document);

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      const on = btn.getAttribute('data-lang') === lang;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    // Rebuild the JS-generated UI in the new language, keeping the tool open.
    const keep = activeToolId;
    init(keep);

    const locale = lang === 'it' ? 'it_IT' : 'en_US';
    const setMeta = (sel, content) => {
      const el = document.querySelector(sel);
      if (el) el.setAttribute('content', content);
    };
    setMeta('meta[property="og:locale"]', locale);
    setMeta('meta[property="og:title"]', FolioI18N.t('ap.page.title'));
    setMeta('meta[property="og:description"]', FolioI18N.t('ap.meta.desc'));
    setMeta('meta[name="description"]', FolioI18N.t('ap.meta.desc'));
    FolioI18N.syncUrl(lang);
    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || /^[a-z]+:/i.test(href)) return;
      const hashIdx = href.indexOf('#');
      const hash = hashIdx >= 0 ? href.slice(hashIdx) : '';
      let path = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
      path = path.replace(/[?&]lang=(en|it)/, '');
      if (lang === 'it') path += (path.indexOf('?') >= 0 ? '&' : '?') + 'lang=it';
      link.setAttribute('href', path + hash);
    });
  }

  document.querySelectorAll('.lang-btn').forEach((btn) => {
    btn.addEventListener('click', function () {
      const lang = this.getAttribute('data-lang');
      FolioI18N.set(lang);
      applyLanguage(lang);
    });
  });

  document.addEventListener('DOMContentLoaded', function () {
    applyLanguage(FolioI18N.current());
    const requested = toolFromUrl();
    if (requested && findTool(requested)) selectTool(requested);
  });
  </script>
</body>
</html>
